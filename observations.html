  <!--
    DAILY OBSERVATIONS PAGE (v1, fresh build 2026-06-04)
    Purpose: the daily transcript-audit habit, productized. One day at a
    time: honest call dispositions (6-bucket taxonomy), clinical roster,
    stalled cases, duplicate-phone clusters, dropped SMS threads, and the
    raw transcripts inline. "Copy digest" produces the paste-ready block
    for the daily-ops-log Claude workflow.
    Disposition taxonomy (ratified 2026-06-03):
      handled / routed / engaged-patient-ended / greeting-drop / system / unclassified
    Collision-era rule: before 2026-06-04, ended_reason
    assistant-said-end-call-phrase was triggerable by Sam saying
    "take care of ..." (config bug, fixed 2026-06-03 ~23:00 ET). Pre-fix
    phrase-ended calls whose transcript contains "take care of" and no
    closing signature classify as SYSTEM (collision kill), not handled.
  -->

  <style>
    html, body { background: #071323; min-height: 100%; }
    :root {
      --navy-0: #071323; --navy-1: #0a1628; --navy-2: #0f2044; --navy-3: #17305e;
      --cyan: #00c8e8; --cyan-soft: #73d7f3; --cyan-dim: #0097b2;
      --white: #f5f9ff; --text-primary: #e8f0fe; --text-secondary: #b4c7e2;
      --text-muted: #7f96b8; --text-faint: #5f7597;
      --border: rgba(255,255,255,0.08); --border-soft: rgba(255,255,255,0.05);
      --surface: rgba(255,255,255,0.035); --surface-2: rgba(255,255,255,0.02); --surface-3: rgba(255,255,255,0.05);
      --shadow-md: 0 14px 32px rgba(0,0,0,0.18);

      --warning: #f0a500; --danger: #e84545; --success: #00c87a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    }
    button, input, a { font: inherit; }
    a { color: var(--cyan-soft); text-decoration: none; }
    .hidden { display: none !important; }

    /* auth */
    .auth-wrap { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; box-shadow: var(--shadow-md); }
    .auth-card h1 { font-family: "DM Serif Display", serif; font-size: 22px; margin-bottom: 4px; }
    .auth-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
    .auth-card input { width: 100%; background: var(--navy-1); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); padding: 10px 12px; margin-bottom: 10px; }
    .auth-card button { width: 100%; background: var(--cyan); border: none; border-radius: 8px; color: #04222b; font-weight: 700; padding: 11px; cursor: pointer; }
    .auth-err { display: none; color: var(--danger); font-size: 13px; margin-top: 10px; }

    /* shell */
    .shell { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
    .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }

    .ctrl:hover { border-color: var(--cyan-dim); }

    .tile.t-system .v { color: var(--danger); }
    .tile.t-unk .v { color: var(--text-faint); }

    /* tables */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: var(--text-faint); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 1px solid var(--border); }

    tr:last-child td { border-bottom: none; }
    .chip { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--border); white-space: nowrap; }

    .c-engaged { color: var(--text-secondary); }
    .c-drop { color: var(--urgent); border-color: rgba(240,165,0,0.4); }
    .c-system { color: var(--danger); border-color: rgba(232,69,69,0.45); }
    .c-unk { color: var(--text-faint); }
    .c-test { color: var(--text-faint); border-style: dashed; }
    .sev { font-weight: 700; text-transform: uppercase; font-size: 11px; }
    .sev-critical { color: var(--critical); } .sev-urgent { color: var(--urgent); }
    .sev-routine { color: var(--routine); } .sev-null { color: var(--text-faint); }
    details.tx { margin-top: 4px; }
    details.tx summary { cursor: pointer; color: var(--cyan-dim); font-size: 12px; }
    details.tx pre { white-space: pre-wrap; background: var(--navy-1); border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px; margin-top: 6px; color: var(--text-secondary); font-size: 12px; font-family: "DM Sans", sans-serif; }
    .empty { color: var(--text-faint); font-size: 13px; padding: 6px 0; }
    .cluster { border: 1px solid rgba(240,165,0,0.35); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: rgba(240,165,0,0.05); }
    .loading { color: var(--text-muted); padding: 30px 0; text-align: center; }
    #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy-3); border: 1px solid var(--cyan-dim); color: var(--text-primary); border-radius: 10px; padding: 10px 18px; display: none; z-index: 50; }

<script>
var SUPABASE_URL = "https://zjwnqryeefegqfmamaqd.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpqd25xcnllZWZlZ3FmbWFtYXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDkwNzEsImV4cCI6MjA4NzA4NTA3MX0.1y6zegT86moJ-Kl3UNkqimd06qV7Ef5Om3s2NpVCtNI";

// Collision-kill era boundary: the "take care" End Call Phrase hotfix
// shipped 2026-06-03 ~23:00 ET. Phrase-ended calls BEFORE this instant
// could be Sam hanging up mid-conversation. After it, phrase-ends are
// trustworthy.
var COLLISION_FIX_ISO = "2026-06-04T03:00:00Z"; // 2026-06-03 23:00 ET

var CLOSING_RE = /(bye for now|hang in there|emergency room or call 911|emergency room or call nine one one|you're all set|glad i could help|take care\.)/i;
var TAKE_CARE_OF_RE = /take care of/i;
var SYSTEM_REASON_RE = /(pipeline|provider|error|failed|no-available|db-)/i;

var TRIAGE_TAG_LABELS = { facial_trauma_high_energy: "Facial trauma (high energy)", post_extraction_possible_dry_socket: "Post-extraction / dry socket", pericoronitis_possible: "Pericoronitis", suspected_odontogenic_infection: "Odontogenic infection", broken_tooth_trauma_low_energy: "Broken tooth (low energy)", suspected_irreversible_pulpitis: "Irreversible pulpitis", soft_tissue_lesion_unspecified: "Soft tissue lesion", tooth_structure_loss_no_pain: "Tooth structure loss (no pain)", routine_dental_pain: "Routine dental pain", acute_dental_pain_unspecified: "Acute dental pain (unspecified)", non_emergent_inquiry: "Non-emergent inquiry" };

if (!window.supabase || !window.supabase.createClient) {
  document.getElementById("auth-error").style.display = "block";
  document.getElementById("auth-error").textContent = "Supabase library failed to load.";
  throw new Error("Supabase library missing");
}
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var lastDigest = "";

// ---------- auth ----------
document.getElementById("auth-btn").addEventListener("click", handleLogin);
document.getElementById("auth-email").addEventListener("keydown", function(e){ if (e.key === "Enter") handleLogin(); });
document.getElementById("auth-password").addEventListener("keydown", function(e){ if (e.key === "Enter") handleLogin(); });
document.getElementById("signout-btn").addEventListener("click", async function(){ await sb.auth.signOut(); location.reload(); });

async function handleLogin() {
  var email = document.getElementById("auth-email").value.trim();
  var password = document.getElementById("auth-password").value;
  var errEl = document.getElementById("auth-error");
  errEl.style.display = "none";
  if (!email || !password) { errEl.textContent = "Enter both email and password."; errEl.style.display = "block"; return; }
  var r = await sb.auth.signInWithPassword({ email: email, password: password });
  if (r.error || !r.data || !r.data.user) { errEl.textContent = (r.error && r.error.message) || "Sign-in failed."; errEl.style.display = "block"; return; }
  showApp();
}

sb.auth.getSession().then(function(r){ if (r.data && r.data.session) showApp(); });

function showApp() {
  document.getElementById("auth-view").classList.add("hidden");
  document.getElementById("app-view").classList.remove("hidden");
  if (!document.getElementById("day-pick").value) setDay(todayStr());
  loadDay();
}

// ---------- date handling ----------
// Day boundaries are the VIEWER's local midnight. All users are in the
// practice timezone (America/Toronto), so viewer-local == practice-local.
function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function setDay(s) { document.getElementById("day-pick").value = s; }
function shiftDay(n) {
  var v = document.getElementById("day-pick").value || todayStr();
  var d = new Date(v + "T12:00:00");
  d.setDate(d.getDate() + n);
  setDay(d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"));
  loadDay();
}
function dayRange() {
  var v = document.getElementById("day-pick").value || todayStr();
  var start = new Date(v + "T00:00:00");
  var end = new Date(start.getTime() + 24*3600*1000);
  return { label: v, startISO: start.toISOString(), endISO: end.toISOString() };
}
document.getElementById("prev-day").addEventListener("click", function(){ shiftDay(-1); });
document.getElementById("next-day").addEventListener("click", function(){ shiftDay(1); });
document.getElementById("today-btn").addEventListener("click", function(){ setDay(todayStr()); loadDay(); });
document.getElementById("day-pick").addEventListener("change", loadDay);
document.getElementById("refresh-btn").addEventListener("click", loadDay);
document.getElementById("copy-digest").addEventListener("click", copyDigest);

// ---------- helpers ----------
function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function tLocal(iso) { if (!iso) return ""; var d = new Date(iso); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function last4(p) { return p ? "..." + String(p).replace(/\D/g,"").slice(-4) : ""; }
function isTest(src) { return !!(src && /_test$/.test(src)); }
function sevHtml(s) { var c = s ? ("sev-" + s) : "sev-null"; return '<span class="sev ' + c + '">' + esc(s || "pending") + "</span>"; }
function tagLabel(t) { return TRIAGE_TAG_LABELS[t] || t || ""; }
function toast(msg) { var el = document.getElementById("toast"); el.textContent = msg; el.style.display = "block"; setTimeout(function(){ el.style.display = "none"; }, 2200); }

// ---------- the disposition classifier (ratified taxonomy) ----------
// Buckets: handled | routed | engaged | drop | system | unclassified
// Methodology is rendered on the page so the formula is never hidden.
function classifyCall(c) {
  var r = c.ended_reason || "";
  var t = c.transcript || "";
  var dur = c.duration_seconds || 0;
  var hasClosing = CLOSING_RE.test(t);
  var userTurns = (t.match(/^User:/gm) || []).length;
  var preFix = c.created_at < COLLISION_FIX_ISO;

  if (r === "assistant-forwarded-call") return "routed";
  if (r === "assistant-said-end-call-phrase" || r === "assistant-ended-call") {
    if (preFix && TAKE_CARE_OF_RE.test(t) && !hasClosing) return "system"; // collision kill
    return "handled";
  }
  if (r === "customer-ended-call") {
    if (hasClosing) return "handled";
    if (userTurns >= 1 && dur >= 15) return "engaged";
    return "drop";
  }
  if (r === "silence-timed-out") {
    if (hasClosing) return "handled";
    if (userTurns >= 1) return "engaged";
    return "drop";
  }
  if (SYSTEM_REASON_RE.test(r)) return "system";
  return "unclassified";
}
function isCollisionKill(c) {
  return (c.ended_reason === "assistant-said-end-call-phrase" || c.ended_reason === "assistant-ended-call") &&
         c.created_at < COLLISION_FIX_ISO && TAKE_CARE_OF_RE.test(c.transcript || "") && !CLOSING_RE.test(c.transcript || "");
}
var BUCKET_LABELS = { handled: "Handled end-to-end", routed: "Routed to office", engaged: "Engaged, patient ended", drop: "Greeting drop-off", system: "System error", unclassified: "Unclassified" };
var CHIP_CLASS = { handled: "c-handled", routed: "c-routed", engaged: "c-engaged", drop: "c-drop", system: "c-system", unclassified: "c-unk" };

// ---------- data load ----------
var state = { calls: [], cases: [], sms: [], threadCases: {} };

async function loadDay() {
  var p = document.getElementById("panels");
  p.innerHTML = '<div class="loading">Loading...</div>';
  var r = dayRange();
  document.getElementById("status-line").textContent = "";
  try {
    var callsQ = sb.from("call_transcripts")
      .select("created_at,ended_reason,duration_seconds,caller_number,intake_source,transcript")
      .gte("created_at", r.startISO).lt("created_at", r.endISO)
      .order("created_at", { ascending: true });
    var casesQ = sb.from("triage_cases")
      .select("id,created_at,inquiry_type,severity,triage_tag,extraction_source,intake_source,final_disposition,reviewed_at,contacted_patient_at,patient_language,patient_name,patient_phone,chief_complaint,sms_fallback_sent_at,has_sms_continuation,review_status")
      .gte("created_at", r.startISO).lt("created_at", r.endISO)
      .order("created_at", { ascending: true });
    var smsQ = sb.from("sms_log")
      .select("case_id,direction,sent_at,sender_name")
      .gte("created_at", r.startISO).lt("created_at", r.endISO)
      .order("sent_at", { ascending: true });

    var res = await Promise.all([callsQ, casesQ, smsQ]);
    for (var i = 0; i < res.length; i++) {
      if (res[i].error) throw new Error(["calls","cases","sms_log"][i] + ": " + res[i].error.message);
    }
    state.calls = res[0].data || [];
    state.cases = res[1].data || [];
    state.sms = res[2].data || [];

    // fetch case rows referenced by today's SMS but created earlier
    var known = {}; state.cases.forEach(function(c){ known[c.id] = c; });
    var missing = [];
    state.sms.forEach(function(m){ if (m.case_id && !known[m.case_id] && missing.indexOf(m.case_id) < 0) missing.push(m.case_id); });
    state.threadCases = Object.assign({}, known);
    if (missing.length > 0) {
      var extra = await sb.from("triage_cases")
        .select("id,patient_name,patient_phone,inquiry_type,severity,review_status,final_disposition")
        .in("id", missing.slice(0, 200));
      if (!extra.error && extra.data) extra.data.forEach(function(c){ state.threadCases[c.id] = c; });
    }
    render(r);
  } catch (e) {
    p.innerHTML = '<div class="card"><h2>Load failed</h2><div class="note">' + esc(e.message) + "</div></div>";
  }
}

// ---------- derivations ----------
function derive(r) {
  var real = state.calls.filter(function(c){ return !isTest(c.intake_source); });
  var tests = state.calls.length - real.length;
  var buckets = { handled: [], routed: [], engaged: [], drop: [], system: [], unclassified: [] };
  real.forEach(function(c){ buckets[classifyCall(c)].push(c); });
  var kills = buckets.system.filter(isCollisionKill).length;
  var headlineNum = buckets.handled.length + buckets.routed.length;
  var headlinePct = real.length ? Math.round(100 * headlineNum / real.length) : 0;

  var realCases = state.cases.filter(function(c){ return !isTest(c.intake_source); });
  var sev = { critical: [], urgent: [], routine: [], pending: [] };
  realCases.forEach(function(c){ (c.severity ? sev[c.severity] : sev.pending).push(c); });
  var needsHuman = realCases.filter(function(c){ return c.inquiry_type === "clinical" && !c.reviewed_at; })
    .sort(function(a,b){ var o = { critical:0, urgent:1, routine:2 }; return (o[a.severity] ?? 3) - (o[b.severity] ?? 3); });

  // clusters: phones with >1 case today
  var byPhone = {};
  realCases.forEach(function(c){ if (!c.patient_phone) return; (byPhone[c.patient_phone] = byPhone[c.patient_phone] || []).push(c); });
  var clusters = Object.keys(byPhone).filter(function(p){ return byPhone[p].length > 1; })
    .map(function(p){ return { phone: p, cases: byPhone[p], pending: byPhone[p].filter(function(c){ return !c.severity; }).length }; });

  // dropped threads: last message of the day on a case is patient inbound
  var lastByCase = {};
  state.sms.forEach(function(m){ if (m.case_id) lastByCase[m.case_id] = m; });
  var dropped = Object.keys(lastByCase).filter(function(id){ return lastByCase[id].direction === "inbound"; })
    .map(function(id){ return { case_id: id, at: lastByCase[id].sent_at, c: state.threadCases[id] || {} }; });

  return { real: real, tests: tests, buckets: buckets, kills: kills, headlineNum: headlineNum, headlinePct: headlinePct,
           realCases: realCases, sev: sev, needsHuman: needsHuman, clusters: clusters, dropped: dropped };
}

// ---------- render ----------
function render(r) {
  var d = derive(r);
  var h = "";

  // 1) Disposition headline
  h += '<div class="card"><h2>Call dispositions</h2>' +
    '<div class="note">Real inbound calls only (tests excluded at source by intake_source tag). Headline = (handled + routed) / all real calls. ' +
    'Pre-' + COLLISION_FIX_ISO.slice(0,10) + ' phrase-ended calls saying "take care of..." with no closing are collision kills (config bug, fixed 2026-06-03) and count as system errors. ' +
    'Routed = transfers; the asked-for-person vs capability-gap split is pending transfer_reason instrumentation.</div>' +
    '<div class="headline">' +
      '<div class="big-tile"><div class="v">' + d.headlinePct + '%</div><div class="l">Handled or correctly routed (' + d.headlineNum + '/' + d.real.length + ' real calls)</div></div>' +
      '<div class="big-tile"><div class="v">' + d.real.length + '</div><div class="l">Real calls (' + d.tests + ' test call' + (d.tests === 1 ? "" : "s") + ' excluded)</div></div>' +
    '</div><div class="tiles">';
  ["handled","routed","engaged","drop","system","unclassified"].forEach(function(b){
    var extra = (b === "system" && d.kills > 0) ? (" (" + d.kills + " collision)") : "";
    h += '<div class="tile t-' + (b === "engaged" ? "engaged" : b === "drop" ? "drop" : b === "unclassified" ? "unk" : b) + '">' +
         '<div class="v">' + d.buckets[b].length + '</div><div class="l">' + BUCKET_LABELS[b] + extra + '</div></div>';
  });
  h += "</div></div>";

  // 2) Clinical day
  h += '<div class="card"><h2>Clinical day</h2>' +
    '<div class="note">Cases created this day. Critical ' + d.sev.critical.length + ' / urgent ' + d.sev.urgent.length +
    ' / routine ' + d.sev.routine.length + ' / pending ' + d.sev.pending.length +
    '. Unreviewed clinical (needs a human): ' + d.needsHuman.length + '.</div>';
  if (d.realCases.length === 0) h += '<div class="empty">No cases.</div>';
  else {
    h += '<table><tr><th>Time</th><th>Severity</th><th>Tag</th><th>Patient</th><th>Complaint</th><th>Source</th><th>Status</th></tr>';
    d.realCases.forEach(function(c){
      var status = c.final_disposition ? esc(c.final_disposition)
        : c.contacted_patient_at ? "contacted"
        : c.reviewed_at ? "reviewed"
        : esc(c.review_status || "new");
      h += "<tr><td>" + tLocal(c.created_at) + "</td><td>" + sevHtml(c.severity) + "</td><td>" + esc(tagLabel(c.triage_tag)) +
           "</td><td>" + esc(c.patient_name || "") + " <span class='faint'>" + last4(c.patient_phone) + "</span></td><td>" +
           esc((c.chief_complaint || "").slice(0, 90)) + "</td><td class='faint'>" + esc(c.intake_source || "") +
           "</td><td>" + status + "</td></tr>";
    });
    h += "</table>";
  }
  h += "</div>";

  // 3) Duplicate clusters
  h += '<div class="card"><h2>Duplicate-case clusters</h2>' +
    '<div class="note">Phones with more than one case this day. One patient episode fragmented across rows (the 2026-06-03 pattern): the real classification, staff contact, and booking confirmation can land on different siblings. Episode-level dedupe is the planned fix; until then, review these together.</div>';
  if (d.clusters.length === 0) h += '<div class="empty">No multi-case phones.</div>';
  else d.clusters.forEach(function(cl){
    h += '<div class="cluster"><strong>' + last4(cl.phone) + "</strong> - " + cl.cases.length + " cases" +
         (cl.pending ? " (" + cl.pending + " pending)" : "") + "<br/>";
    cl.cases.forEach(function(c){
      h += '<span class="faint">' + tLocal(c.created_at) + "</span> " + sevHtml(c.severity) + " " +
           esc(c.patient_name || "") + " <span class='faint'>" + esc(c.review_status || "") +
           (c.final_disposition ? " / " + esc(c.final_disposition) : "") + "</span><br/>";
    });
    h += "</div>";
  });
  h += "</div>";

  // 4) Stalled
  var stalled = d.sev.pending;
  h += '<div class="card"><h2>Stalled / incomplete intakes</h2>' +
    '<div class="note">Severity still null - intake started, triage never finished. SMS fallback and continuation flags shown.</div>';
  if (stalled.length === 0) h += '<div class="empty">None.</div>';
  else {
    h += "<table><tr><th>Time</th><th>Patient</th><th>Source</th><th>Complaint</th><th>Flags</th></tr>";
    stalled.forEach(function(c){
      var flags = [];
      if (c.has_sms_continuation) flags.push("sms-continued");
      if (c.sms_fallback_sent_at) flags.push("fallback-sent");
      h += "<tr><td>" + tLocal(c.created_at) + "</td><td>" + esc(c.patient_name || "") + " <span class='faint'>" + last4(c.patient_phone) +
           "</span></td><td class='faint'>" + esc(c.intake_source || "") + "</td><td>" + esc((c.chief_complaint || "").slice(0, 80)) +
           "</td><td class='faint'>" + flags.join(", ") + "</td></tr>";
    });
    h += "</table>";
  }
  h += "</div>";

  // 5) Dropped threads
  h += '<div class="card"><h2>Open SMS threads (last message = patient, unanswered)</h2>' +
    '<div class="note">Caveat (the Sharen lesson): a final inbound can be a booking CONFIRMATION, not a dropped thread - read it before acting. Post-triage auto-acks already answer clinical follow-ups.</div>';
  if (d.dropped.length === 0) h += '<div class="empty">None.</div>';
  else {
    h += "<table><tr><th>Last msg</th><th>Patient</th><th>Severity</th><th>Case status</th></tr>";
    d.dropped.forEach(function(t){
      h += "<tr><td>" + tLocal(t.at) + "</td><td>" + esc(t.c.patient_name || "") + " <span class='faint'>" + last4(t.c.patient_phone) +
           "</span></td><td>" + sevHtml(t.c.severity) + "</td><td class='faint'>" + esc(t.c.review_status || "") +
           (t.c.final_disposition ? " / " + esc(t.c.final_disposition) : "") + "</td></tr>";
    });
    h += "</table>";
  }
  h += "</div>";

  // 6) Calls with transcripts (the audit)
  h += '<div class="card"><h2>Every call, with transcript</h2>' +
    '<div class="note">The transcript-audit habit, in the page. Disposition chips use the taxonomy above; expand any row to read the call.</div>';
  if (state.calls.length === 0) h += '<div class="empty">No calls.</div>';
  else {
    h += "<table><tr><th>Time</th><th>Caller</th><th>Disposition</th><th>Ended reason</th><th>Secs</th></tr>";
    state.calls.forEach(function(c){
      var test = isTest(c.intake_source);
      var b = test ? null : classifyCall(c);
      var chip = test ? '<span class="chip c-test">test</span>'
        : '<span class="chip ' + CHIP_CLASS[b] + '">' + BUCKET_LABELS[b] + (isCollisionKill(c) ? " (collision)" : "") + "</span>";
      h += "<tr><td>" + tLocal(c.created_at) + "</td><td>" + last4(c.caller_number) + "</td><td>" + chip +
           "</td><td class='faint'>" + esc(c.ended_reason || "") + "</td><td>" + Math.round(c.duration_seconds || 0) + "</td></tr>";
      h += '<tr><td colspan="5"><details class="tx"><summary>transcript</summary><pre>' + esc(c.transcript || "(empty)") + "</pre></details></td></tr>";
    });
    h += "</table>";
  }
  h += "</div>";

  document.getElementById("panels").innerHTML = h;
  document.getElementById("status-line").textContent = "Loaded " + r.label + " - " + state.calls.length + " calls, " +
    state.cases.length + " cases, " + state.sms.length + " SMS rows. Live data; recent rows may still mature.";
  lastDigest = buildDigest(r, d);
}

// ---------- digest ----------
function buildDigest(r, d) {
  var L = [];
  L.push("=== DAILY OBSERVATIONS - " + r.label + " ===");
  L.push("CALLS (real): " + d.real.length +
    " | handled " + d.buckets.handled.length +
    " | routed " + d.buckets.routed.length +
    " | engaged-patient-ended " + d.buckets.engaged.length +
    " | greeting drops " + d.buckets.drop.length +
    " | system " + d.buckets.system.length + (d.kills ? " (incl " + d.kills + " collision kills)" : "") +
    " | unclassified " + d.buckets.unclassified.length +
    " | tests excluded " + d.tests);
  L.push("HEADLINE handled-or-routed: " + d.headlinePct + "% (" + d.headlineNum + "/" + d.real.length + ")");
  L.push("CASES: " + d.realCases.length + " created | critical " + d.sev.critical.length +
    " | urgent " + d.sev.urgent.length + " | routine " + d.sev.routine.length + " | pending " + d.sev.pending.length);
  if (d.needsHuman.length) {
    L.push("NEEDS HUMAN (unreviewed clinical):");
    d.needsHuman.forEach(function(c){ L.push("  - " + (c.severity || "pending").toUpperCase() + " " + (c.patient_name || "?") + " " + last4(c.patient_phone) + " - " + (c.chief_complaint || "").slice(0, 70)); });
  }
  if (d.sev.pending.length) {
    L.push("STALLED (severity null):");
    d.sev.pending.forEach(function(c){ L.push("  - " + tLocal(c.created_at) + " " + (c.patient_name || "?") + " " + last4(c.patient_phone) + " [" + (c.intake_source || "") + "]"); });
  }
  if (d.clusters.length) {
    L.push("CLUSTERS (multi-case phones):");
    d.clusters.forEach(function(cl){ L.push("  - " + last4(cl.phone) + " x" + cl.cases.length + (cl.pending ? " (" + cl.pending + " pending)" : "")); });
  }
  if (d.dropped.length) {
    L.push("OPEN THREADS (verify not booking confirmations):");
    d.dropped.forEach(function(t){ L.push("  - " + (t.c.patient_name || t.case_id.slice(0,8)) + " last inbound " + tLocal(t.at)); });
  }
  L.push("(paste this block into the Claude ops session for the daily-ops-log entry)");
  return L.join("\n");
}

function copyDigest() {
  if (!lastDigest) { toast("Load a day first"); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(lastDigest).then(function(){ toast("Digest copied"); },
      function(){ fallbackCopy(); });
  } else fallbackCopy();
}
function fallbackCopy() {
  var ta = document.createElement("textarea");
  ta.value = lastDigest; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Digest copied"); } catch (e) { toast("Copy failed - select manually"); }
  document.body.removeChild(ta);
}
</script>
</body>
</html>
