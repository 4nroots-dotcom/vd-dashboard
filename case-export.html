<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />
  <title>VirtualDentist.ai - Case Export</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #eef3f8;
      --paper: #ffffff;
      --ink: #16263a;
      --muted: #5d6b7b;
      --line: #d8e0e8;
      --line-strong: #b8c4d1;
      --accent: #1f78c8;
      --urgent: #d84b4b;
      --emergency: #d59a18;
      --routine: #23915a;
      --signoff-bg: rgba(35, 145, 90, 0.06);
      --signoff-line: rgba(35, 145, 90, 0.18);
      --discrepancy-bg: rgba(213, 154, 24, 0.06);
      --discrepancy-line: rgba(213, 154, 24, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.45;
    }

    body {
      padding: 24px;
    }

    .app-shell {
      max-width: 980px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .print-hint {
      max-width: 980px;
      margin: -6px auto 16px;
      font-size: 12px;
      color: var(--muted);
    }

    .btn,
    .link-btn {
      appearance: none;
      border: 1px solid #c8d3df;
      background: #fff;
      color: #203246;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover,
    .link-btn:hover {
      background: #f5f8fb;
      border-color: #aebccd;
    }

    .btn-primary {
      border-color: #1f78c8;
      background: #1f78c8;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1667ae;
      border-color: #1667ae;
    }

    .case-paper {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(16, 36, 62, 0.06);
      overflow: hidden;
    }

    .paper-header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand-logo {
      height: 30px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .record-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .record-subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    .header-meta {
      text-align: right;
      min-width: 220px;
    }

    .header-meta-row {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .severity-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid transparent;
      margin-top: 4px;
    }

    .severity-pill.urgent {
      color: var(--urgent);
      background: rgba(216, 75, 75, 0.08);
      border-color: rgba(216, 75, 75, 0.18);
    }

    .severity-pill.emergency {
      color: var(--emergency);
      background: rgba(213, 154, 24, 0.1);
      border-color: rgba(213, 154, 24, 0.22);
    }

    .severity-pill.routine {
      color: var(--routine);
      background: rgba(35, 145, 90, 0.08);
      border-color: rgba(35, 145, 90, 0.18);
    }

    .severity-pill.unknown {
      color: var(--accent);
      background: rgba(31, 120, 200, 0.08);
      border-color: rgba(31, 120, 200, 0.18);
    }

    .paper-body {
      padding: 24px 28px 30px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    .section-head {
      padding: 12px 16px;
      background: #f7fafc;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #3a4c60;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .section-note {
      font-size: 12px;
      color: var(--muted);
    }

    .section-body {
      padding: 16px;
    }

    .grid-2,
    .grid-3,
    .grid-4 {
      display: grid;
      gap: 12px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .field {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #fbfdff;
      min-height: 72px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 700;
      color: #688097;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .field-value {
      font-size: 14px;
      color: var(--ink);
      word-break: break-word;
    }

    .field-value.mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .narrative {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      color: var(--ink);
    }

    .narrative.mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .flags-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
    }

    .flag-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 24px;
    }

    .flag-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .flag-dot.present {
      background: var(--urgent);
      box-shadow: 0 0 0 3px rgba(216, 75, 75, 0.1);
    }

    .flag-dot.absent {
      background: #c5d0db;
    }

    .flag-label {
      font-size: 14px;
      color: var(--ink);
    }

    .flag-label.muted {
      color: var(--muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid var(--line-strong);
      color: #38516a;
      background: #f4f8fb;
    }

    .status-pill.reviewed {
      color: var(--routine);
      border-color: rgba(35, 145, 90, 0.25);
      background: rgba(35, 145, 90, 0.08);
    }

    .status-pill.draft {
      color: var(--accent);
      border-color: rgba(31, 120, 200, 0.22);
      background: rgba(31, 120, 200, 0.08);
    }

    .status-pill.new {
      color: #8a5b00;
      border-color: rgba(213, 154, 24, 0.22);
      background: rgba(213, 154, 24, 0.1);
    }

    .signoff-panel {
      border: 1px solid var(--signoff-line);
      background: var(--signoff-bg);
      border-radius: 10px;
      padding: 14px;
    }

    .signoff-grid {
      display: grid;
      gap: 10px;
    }

    .signoff-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(35, 145, 90, 0.12);
    }

    .signoff-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .signoff-label {
      font-size: 10px;
      font-weight: 700;
      color: #55755f;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .signoff-value {
      font-size: 14px;
      color: #163023;
      text-align: right;
      word-break: break-word;
    }

    .discrepancy-panel {
      border: 1px solid var(--discrepancy-line);
      background: var(--discrepancy-bg);
      border-radius: 10px;
      padding: 14px;
    }

    .discrepancy-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(213, 154, 24, 0.14);
    }

    .discrepancy-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .discrepancy-item:first-child {
      padding-top: 0;
    }

    .discrepancy-field-name {
      font-size: 10px;
      font-weight: 700;
      color: #8a6a00;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .discrepancy-line {
      font-size: 13px;
      color: #3a3000;
      line-height: 1.5;
    }

    .discrepancy-line + .discrepancy-line {
      margin-top: 4px;
    }

    .discrepancy-verify {
      margin-top: 6px;
      font-size: 12px;
      color: #6a5500;
      padding-top: 6px;
      border-top: 1px solid rgba(213, 154, 24, 0.12);
    }

    .footer-note {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .loading-box,
    .error-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      box-shadow: 0 10px 30px rgba(16, 36, 62, 0.06);
    }

    .error-box {
      color: #8b2f2f;
      border-color: rgba(216, 75, 75, 0.18);
      background: #fffafa;
    }

    .print-only {
      display: none;
    }

    @media (max-width: 760px) {
      body {
        padding: 12px;
      }

      .paper-header {
        flex-direction: column;
      }

      .header-meta {
        text-align: left;
        min-width: auto;
      }

      .grid-2,
      .grid-3,
      .grid-4,
      .flags-grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar-left,
      .toolbar-right {
        width: 100%;
        justify-content: space-between;
      }

      .signoff-row {
        flex-direction: column;
        gap: 4px;
      }

      .signoff-value {
        text-align: left;
      }
    }

    @media print {
      @page {
        size: auto;
        margin: 14mm;
      }

      html,
      body {
        background: #fff !important;
      }

      body {
        padding: 0;
      }

      .toolbar {
        display: none !important;
      }

      .case-paper {
        box-shadow: none;
        border: 1px solid #cfd8e2;
        border-radius: 0;
      }

      .section,
      .field,
      .signoff-panel,
      .discrepancy-panel {
        break-inside: avoid;
      }

      .print-only {
        display: block;
      }

      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="toolbar no-print">
      <div class="toolbar-left">
        <a class="link-btn" href="dashboard.html">&larr; Back to Dashboard</a>
      </div>
      <div class="toolbar-right">
        <button class="btn" id="reload-btn" type="button">Reload</button>
        <button class="btn btn-primary" id="print-btn" type="button">Print / Save PDF</button>
      </div>
    </div>

    <div class="print-hint no-print">
      For a clean clinical record, disable browser headers/footers in print settings.
    </div>

    <div id="loading-state" class="loading-box">Loading case export&hellip;</div>
    <div id="error-state" class="error-box" style="display:none;"></div>
    <div id="export-root" style="display:none;"></div>
  </div>

  <script>
    var SUPABASE_URL = "https://zjwnqryeefegqfmamaqd.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpqd25xcnllZWZlZ3FmbWFtYXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDkwNzEsImV4cCI6MjA4NzA4NTA3MX0.1y6zegT86moJ-Kl3UNkqimd06qV7Ef5Om3s2NpVCtNI";

    var REVIEWER_NAME_MAP = {
      "4nroots@gmail.com": "Dr. Balaji Swaminath",
      "hamitranu@gmail.com": "Dr. Hamit Ranu"
    };

    var CONTRADICTION_FIELD_LABELS = {
      fever: "Fever",
      swelling: "Swelling",
      trauma: "Trauma",
      bleeding: "Bleeding",
      uncontrolled_bleeding: "Uncontrolled bleeding",
      breathing_swallowing: "Airway / Swallowing",
      difficulty_breathing_or_swallowing: "Airway / Swallowing",
      feeling_unwell: "Feeling Unwell",
      avulsed_tooth: "Avulsed tooth",
      jaw_fracture_signs: "Jaw fracture signs",
      immunocompromised: "Immunocompromised",
      pregnant: "Pregnancy",
      anticoagulant: "Blood Thinners",
      recent_extraction: "Recent extraction",
      pericoronitis_signs: "Pericoronitis signs"
    };

    if (!window.supabase || !window.supabase.createClient) {
      throw new Error("Supabase library missing");
    }

    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var loadingEl = document.getElementById("loading-state");
    var errorEl = document.getElementById("error-state");
    var rootEl = document.getElementById("export-root");

    document.getElementById("reload-btn").addEventListener("click", function() {
      loadExport();
    });

    document.getElementById("print-btn").addEventListener("click", function() {
      window.print();
    });

    function resolveReviewerName(email) {
      if (!email) return "-";
      return REVIEWER_NAME_MAP[email] || email;
    }

    function getSO(c) {
      var so = c.structured_output;
      if (!so) return {};
      if (typeof so === "string") {
        try { return JSON.parse(so); } catch (e) { return {}; }
      }
      return so;
    }

    function getContradictions(c) {
      var raw = c.contradictions;
      if (!raw) return [];
      if (typeof raw === "string") {
        try { raw = JSON.parse(raw); } catch (e) { return []; }
      }
      if (!Array.isArray(raw)) return [];
      return raw;
    }

    function humanizeRedFlags(obj) {
      if (!obj) return "None reported";
      if (typeof obj === "string") return obj || "None reported";
      if (Array.isArray(obj)) return obj.length ? obj.join(", ") : "None reported";
      if (typeof obj !== "object") return "None reported";
      if (obj.none_of_the_above === true) return "None reported";

      var labels = {
        trouble_breathing_or_swallowing: "Trouble breathing or swallowing",
        uncontrolled_bleeding: "Uncontrolled bleeding",
        facial_swelling: "Facial swelling",
        fever_or_feeling_unwell: "Fever or feeling unwell",
        injury_to_teeth_jaw_face: "Injury to teeth, jaw, or face"
      };

      var items = Object.entries(obj)
        .filter(function(entry) { return entry[0] !== "none_of_the_above" && entry[1] === true; })
        .map(function(entry) { return labels[entry[0]] || formatTag(entry[0]); });

      return items.length ? items.join(", ") : "None reported";
    }

    function humanizeMedicalFlags(obj) {
      if (!obj) return "No relevant medical history reported";
      if (typeof obj === "string") return obj || "No relevant medical history reported";
      if (Array.isArray(obj)) return obj.length ? obj.join(", ") : "No relevant medical history reported";
      if (typeof obj !== "object") return "No relevant medical history reported";
      if (obj.none_of_the_above === true) return "No relevant medical history reported";

      var labels = {
        allergy_antibiotics: "Allergy to antibiotics",
        allergy_pain_medication: "Allergy to pain medication",
        blood_thinners: "Blood thinners",
        diabetes: "Diabetes",
        pregnancy: "Pregnancy",
        immunocompromised: "Immunocompromised",
        other_important_medical_condition: "Other important medical condition"
      };

      var items = [];
      Object.entries(obj).forEach(function(entry) {
        var key = entry[0];
        var value = entry[1];
        if (key === "none_of_the_above" || key === "other_medical_detail") return;
        if (value !== true) return;
        if (key === "other_important_medical_condition") {
          items.push(obj.other_medical_detail ? ("Other: " + obj.other_medical_detail) : "Other important medical condition");
          return;
        }
        items.push(labels[key] || formatTag(key));
      });

      return items.length ? items.join(", ") : "No relevant medical history reported";
    }

    async function loadExport() {
      loadingEl.style.display = "block";
      errorEl.style.display = "none";
      rootEl.style.display = "none";
      errorEl.textContent = "";

      try {
        var sessionResult = await sb.auth.getSession();
        var sessionData = sessionResult.data;
        var sessionError = sessionResult.error;

        if (sessionError) {
          throw new Error(sessionError.message || "Session error");
        }

        if (!sessionData || !sessionData.session || !sessionData.session.user) {
          throw new Error("Not signed in. Open this page after signing into the dashboard.");
        }

        var caseId = getCaseIdFromUrl();
        if (!caseId) {
          throw new Error("Missing case id in URL. Use case-export.html?id=YOUR_CASE_ID");
        }

        var result = await sb
          .from("triage_cases")
          .select("*")
          .eq("id", caseId)
          .single();

        if (result.error) {
          throw new Error(result.error.message || "Unable to load case");
        }

        if (!result.data) {
          throw new Error("Case not found");
        }

        renderExport(result.data);
        loadingEl.style.display = "none";
        rootEl.style.display = "block";
      } catch (err) {
        loadingEl.style.display = "none";
        errorEl.style.display = "block";
        errorEl.textContent = (err && err.message) ? err.message : "Unexpected export error";
      }
    }

    function getCaseIdFromUrl() {
      var url = new URL(window.location.href);
      return url.searchParams.get("id");
    }

    function renderExport(c) {
      var so = getSO(c);
      var severity = (c.severity || "unknown").toLowerCase();
      var reviewStatus = (c.review_status || "new").toLowerCase();
      var reviewedByName = resolveReviewerName(c.reviewed_by);

      var contradictions = getContradictions(c);
      var hasContradictions = contradictions.length > 0;

      var intakeRedFlags = c.intake_red_flags || {};
      var intakeMedicalFlags = c.intake_medical_flags || {};

      var flags = [
        { label: "Airway / swallowing difficulty", val: so.difficulty_breathing_or_swallowing },
        { label: "Uncontrolled bleeding", val: so.uncontrolled_bleeding },
        { label: "Rapidly spreading swelling", val: so.feels_very_unwell_or_rapidly_increasing_swelling },
        { label: "Avulsed tooth", val: so.avulsed_tooth },
        { label: "Jaw fracture signs", val: so.jaw_fracture_signs },
        { label: "Fever", val: so.fever },
        { label: "Swelling", val: so.swelling || so.swelling_present },
        { label: "Trauma", val: so.trauma },
        { label: "Nocturnal pain", val: so.nocturnal_pain || c.nocturnal_pain },
        { label: "Cold lingers >10s", val: so.cold_pain_lingers_over_10_seconds },
        { label: "Heat sensitivity", val: so.heat_sensitivity || c.heat_sensitivity },
        { label: "Percussion sensitivity", val: so.percussion_sensitivity || c.percussion_sensitivity },
        { label: "Bad taste / drainage", val: so.bad_taste_or_drainage || c.bad_taste_or_drainage },
        { label: "Immunocompromised", val: so.immunocompromised || c.immunocompromised },
        { label: "Pericoronitis signs", val: so.pericoronitis_signs || c.pericoronitis_signs },
        { label: "Recent extraction", val: so.recent_extraction || c.recent_extraction }
      ];

      var html = '<div class="case-paper">' +
        '<div class="paper-header">' +
          '<div class="brand-block">' +
            '<img class="brand-logo" src="virtualdentist-logo.png" alt="VirtualDentist.ai" onerror="this.style.display=\'none\';" />' +
            '<div class="record-title">Clinical Triage Record</div>' +
            '<div class="record-subtitle">Generated for documentation / export</div>' +
          '</div>' +
          '<div class="header-meta">' +
            '<div class="header-meta-row"><strong>Case ID:</strong> ' + escHtml(c.id || "-") + '</div>' +
            '<div class="header-meta-row"><strong>Call date:</strong> ' + escHtml(formatDatetime(c.created_at)) + '</div>' +
            '<div class="header-meta-row"><strong>Exported:</strong> ' + escHtml(formatDatetime(new Date().toISOString())) + '</div>' +
            '<div class="severity-pill ' + escAttr(severity) + '">' + escHtml((c.severity || "unknown").toUpperCase()) + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="paper-body">' +

          /* Patient & Call Information */
          '<div class="section">' +
            '<div class="section-head"><div class="section-title">Patient & Call Information</div></div>' +
            '<div class="section-body"><div class="grid-4">' +
              field("Patient Name", c.patient_name || "Unknown Patient") +
              field("Phone", formatPhone(c.patient_phone) || "-") +
              field("Call Duration", formatDuration(c.duration_seconds)) +
              fieldHtml("Review Status", '<span class="status-pill ' + escAttr(reviewStatus) + '">' + escHtml(reviewStatus) + '</span>') +
              field("Triage Tag", formatTag(c.triage_tag)) +
              field("Extraction Source", c.extraction_source || "-") +
              fieldMono("Call ID", c.vapi_call_id || "-") +
              field("Created At", formatDatetime(c.created_at)) +
            '</div></div>' +
          '</div>' +

          /* Patient Intake */
          '<div class="section">' +
            '<div class="section-head"><div class="section-title">Patient Intake</div></div>' +
            '<div class="section-body"><div class="grid-3">' +
              field("Date of Birth", formatDateOnly(c.patient_dob)) +
              field("City / Province", [c.patient_city, c.patient_province].filter(Boolean).join(", ") || "-") +
              field("Coverage", formatTag(c.coverage_status)) +
              field("Intake Onset", formatTag(c.onset_bucket)) +
              field("Intake-Reported Red Flags", humanizeRedFlags(intakeRedFlags)) +
              field("Relevant Medical History", humanizeMedicalFlags(intakeMedicalFlags)) +
            '</div></div>' +
          '</div>' +

          /* Contradictions */
          (hasContradictions
            ? '<div class="section">' +
                '<div class="section-head"><div class="section-title">\u26A0 Intake vs. Call Discrepancies</div></div>' +
                '<div class="section-body"><div class="discrepancy-panel">' +
                  contradictions.map(function(item) {
                    var fLabel = CONTRADICTION_FIELD_LABELS[item.field] || formatTag(item.field || "Discrepancy");
                    return '<div class="discrepancy-item">' +
                      '<div class="discrepancy-field-name">' + escHtml(fLabel) + '</div>' +
                      '<div class="discrepancy-line"><strong>Intake:</strong> ' + escHtml(item.intake_value || "-") + '</div>' +
                      '<div class="discrepancy-line"><strong>Call:</strong> ' + escHtml(item.call_value || "-") + '</div>' +
                      (item.clinical_note ? '<div class="discrepancy-verify"><strong>Verify:</strong> ' + escHtml(item.clinical_note) + '</div>' : '') +
                    '</div>';
                  }).join("") +
                '</div></div>' +
              '</div>'
            : '') +

          /* Clinical Triage Summary */
          '<div class="section">' +
            '<div class="section-head"><div class="section-title">Clinical Triage Summary</div></div>' +
            '<div class="section-body"><div class="grid-3">' +
              field("Chief Complaint", so.chief_complaint || so.chief_complaint_quote || c.chief_complaint || "-") +
              field("Onset", so.onset || c.onset || "-") +
              field("Pain Score", formatPain(so.pain_score, c.pain_score)) +
              field("Location", [so.jaw, so.side].filter(Boolean).join(" / ") || "-") +
              field("Severity", (c.severity || "unknown").toUpperCase()) +
              field("Severity Reason", c.severity_reason || "-") +
            '</div></div>' +
          '</div>' +

          /* Clinical Flags */
          '<div class="section">' +
            '<div class="section-head"><div class="section-title">Clinical Flags</div></div>' +
            '<div class="section-body"><div class="flags-grid">' +
              flags.map(renderFlagRow).join("") +
            '</div></div>' +
          '</div>' +

          /* AI Clinical Note */
          '<div class="section">' +
            '<div class="section-head"><div class="section-title">AI Clinical Note</div><div class="section-note">System-generated triage note</div></div>' +
            '<div class="section-body"><div class="narrative mono">' + escHtml(c.clinical_note || "No clinical note generated.") + '</div></div>' +
          '</div>' +

          /* Clinical Sign-off (only if reviewed) */
          (reviewStatus === "reviewed"
            ? '<div class="section">' +
                '<div class="section-head"><div class="section-title">Clinical Sign-off</div></div>' +
                '<div class="section-body"><div class="signoff-panel"><div class="signoff-grid">' +
                  '<div class="signoff-row"><div class="signoff-label">Reviewed by</div><div class="signoff-value">' + escHtml(reviewedByName) + '</div></div>' +
                  '<div class="signoff-row"><div class="signoff-label">Reviewed at</div><div class="signoff-value">' + escHtml(formatDatetime(c.reviewed_at)) + '</div></div>' +
                  '<div class="signoff-row"><div class="signoff-label">Final disposition</div><div class="signoff-value">' + escHtml(formatDisposition(c.final_disposition)) + '</div></div>' +
                '</div></div></div>' +
              '</div>'
            : '') +

          /* Dentist Review */
          '<div class="section">' +
            '<div class="section-head"><div class="section-title">Dentist Review</div></div>' +
            '<div class="section-body"><div class="grid-3">' +
              field("Reviewed By", reviewedByName) +
              field("Reviewed At", formatDatetime(c.reviewed_at)) +
              field("Final Disposition", formatDisposition(c.final_disposition)) +
              field("Prescription Issued", formatBoolean(c.prescription_issued)) +
              field("Patient Contacted At", formatDatetime(c.contacted_patient_at)) +
              field("Action Taken", formatDisposition(c.action_taken)) +
            '</div>' +
            '<div style="height:12px;"></div>' +
            '<div class="field" style="min-height:120px;"><div class="field-label">Clinical Addendum</div><div class="field-value narrative">' + escHtml(c.review_notes || "-") + '</div></div>' +
            '</div>' +
          '</div>' +

          /* Audit & Metadata */
          '<div class="section">' +
            '<div class="section-head"><div class="section-title">Audit & Metadata</div></div>' +
            '<div class="section-body"><div class="grid-2">' +
              fieldMono("Case ID", c.id || "-") +
              field("Created Timestamp", formatDatetime(c.created_at)) +
            '</div>' +
            '<div class="footer-note">Transcript omitted by default in this export format.</div>' +
            '</div>' +
          '</div>' +

        '</div>' +
      '</div>';

      rootEl.innerHTML = html;
    }

    function field(label, value) {
      return '<div class="field"><div class="field-label">' + escHtml(label) + '</div><div class="field-value">' + escHtml(value) + '</div></div>';
    }

    function fieldMono(label, value) {
      return '<div class="field"><div class="field-label">' + escHtml(label) + '</div><div class="field-value mono">' + escHtml(value) + '</div></div>';
    }

    function fieldHtml(label, innerHtml) {
      return '<div class="field"><div class="field-label">' + escHtml(label) + '</div><div class="field-value">' + innerHtml + '</div></div>';
    }

    function renderFlagRow(flag) {
      var present = flag.val === true;
      return '<div class="flag-row"><div class="flag-dot ' + (present ? "present" : "absent") + '"></div><div class="flag-label ' + (present ? "" : "muted") + '">' + escHtml(flag.label) + '</div></div>';
    }

    function formatDatetime(value) {
      if (!value) return "-";
      var d = new Date(value);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleDateString("en-CA", {
        year: "numeric",
        month: "short",
        day: "numeric"
      }) + " " + d.toLocaleTimeString("en-CA", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      });
    }

    function formatDateOnly(value) {
      if (!value) return "-";
      var d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleDateString("en-CA", {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined || Number.isNaN(Number(seconds))) return "-";
      var s = Number(seconds);
      var mins = Math.floor(s / 60);
      var secs = s % 60;
      return mins + "m " + secs + "s";
    }

    function formatPhone(p) {
      if (!p) return "-";
      var d = String(p).replace(/\D/g, "");
      if (d.length === 10) return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
      if (d.length === 11 && d.startsWith("1")) return "1 (" + d.slice(1, 4) + ") " + d.slice(4, 7) + "-" + d.slice(7);
      return String(p);
    }

    function formatTag(tag) {
      if (!tag || tag === "-") return "-";
      return String(tag)
        .replace(/_/g, " ")
        .replace(/\b\w/g, function(l) { return l.toUpperCase(); })
        .replace(/ And /g, " & ");
    }

    function formatDisposition(value) {
      if (!value) return "-";
      var map = {
        booked: "Booked appointment",
        referred_er: "Referred to ER",
        rx_only: "Prescription only",
        declined: "Patient declined care",
        no_response: "No response from patient"
      };
      return map[value] || formatTag(value);
    }

    function formatBoolean(value) {
      if (value === true) return "Yes";
      if (value === false) return "No";
      return "-";
    }

    function formatPain(primary, fallback) {
      var pain = (primary != null) ? primary : fallback;
      if (pain === null || pain === undefined || pain === "") return "-";
      return pain + "/10";
    }

    function escHtml(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escAttr(value) {
      return escHtml(value);
    }

    loadExport();
  </script>
</body>
</html>
