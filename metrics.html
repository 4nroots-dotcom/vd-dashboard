<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VirtualDentist.ai — Operational Metrics</title>
  <!-- REFACTOR_MARKER_2026_05_28_METRICS_V3_LANES -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --navy-0:#071323;--navy-1:#0a1628;--cyan:#00c8e8;
      --text-primary:#e8f0fe;--text-secondary:#b4c7e2;--text-muted:#7f96b8;--text-faint:#5f7597;
      --border:rgba(255,255,255,0.08);--surface:rgba(255,255,255,0.035);--surface-2:rgba(255,255,255,0.02);
      --critical:#e84545;--urgent:#f0a500;--routine:#00c87a;--ok:#00c87a;--warn:#f0a500;--danger:#e84545;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{background:var(--navy-0);min-height:100%;}
    body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top center,rgba(51,108,190,0.16),transparent 28%),linear-gradient(180deg,var(--navy-0),var(--navy-1));color:var(--text-primary);font-size:14px;line-height:1.5;min-height:100vh;}
    button,input,a{font:inherit;}
    a{color:var(--cyan);text-decoration:none;}
    #auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .auth-card{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(18,39,81,0.95),rgba(11,27,58,0.95));border:1px solid var(--border);border-radius:18px;padding:36px 30px;}
    .auth-logo{font-size:18px;font-weight:700;margin-bottom:6px;}
    .auth-logo span{color:var(--cyan);}
    .auth-subtitle{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:26px;}
    .field-label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
    .field-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;padding:12px 14px;outline:none;margin-bottom:16px;}
    .field-input:focus{border-color:rgba(0,200,232,0.3);}
    .btn-primary{width:100%;background:linear-gradient(135deg,#4c8fd2,#69cbe7);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;padding:14px;cursor:pointer;}
    .btn-primary:disabled{opacity:.55;}
    .auth-error{background:rgba(232,69,69,0.12);border:1px solid rgba(232,69,69,0.3);border-radius:8px;color:#ff9b9b;font-size:13px;padding:10px 12px;margin-top:12px;display:none;white-space:pre-wrap;}
    #app{display:none;flex-direction:column;min-height:100vh;}
    .header{background:rgba(15,32,68,0.94);border-bottom:1px solid var(--border);padding:0 18px;min-height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
    .header-logo{font-size:15px;font-weight:700;}
    .header-logo span{color:var(--cyan);}
    .header-right{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-muted);}
    .back-link{border:1px solid var(--border);border-radius:7px;padding:6px 12px;color:var(--text-secondary);}
    .signout-btn{background:none;border:1px solid var(--border);color:var(--text-secondary);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:12px;}
    .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:16px 20px 0;max-width:1100px;margin:0 auto;width:100%;}
    .period-chips{display:flex;gap:6px;}
    .chip{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;}
    .chip.active{background:rgba(0,200,232,0.16);border-color:rgba(0,200,232,0.4);color:var(--cyan);}
    .toolbar-right{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-muted);}
    .refresh-btn{background:none;border:1px solid var(--border);color:var(--text-secondary);border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:15px;}
    .main{padding:8px 20px 60px;max-width:1100px;margin:0 auto;width:100%;}
    .qhead{display:flex;align-items:baseline;gap:10px;margin:34px 0 4px;}
    .qhead-num{font-size:13px;font-weight:700;color:var(--cyan);}
    .qhead-title{font-size:17px;font-weight:600;}
    .qhead-sub{font-size:12px;color:var(--text-faint);margin:0 0 14px 24px;}
    .lane-label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 9px;display:flex;align-items:center;gap:8px;}
    .lane-dot{width:8px;height:8px;border-radius:2px;}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:12px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
    .card-label{font-size:12px;color:var(--text-secondary);margin-bottom:7px;}
    .card-val{font-size:24px;font-weight:600;line-height:1.1;}
    .card-val small{font-size:13px;color:var(--text-faint);font-weight:400;}
    .card-note{font-size:11px;color:var(--text-faint);margin-top:5px;}
    .panel{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
    .panel-title{font-size:13px;color:var(--text-secondary);margin-bottom:12px;}
    .bar-row{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:9px;}
    .bar-name{width:160px;color:var(--text-secondary);flex-shrink:0;}
    .bar-track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden;}
    .bar-fill{display:block;height:100%;border-radius:4px;}
    .bar-val{width:72px;text-align:right;flex-shrink:0;}
    .hours{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:6px;}
    .hour-bar{flex:1;background:var(--cyan);opacity:.5;border-radius:2px 2px 0 0;min-height:2px;}
    .hours-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--text-faint);margin-top:4px;}
    .flag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
    .flag{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-secondary);}
    .flag b{font-weight:600;}
    .empty{font-size:13px;color:var(--text-faint);font-style:italic;padding:4px 0;}
    .note-line{font-size:11px;color:var(--text-faint);margin:-2px 0 14px;}
    .loading{padding:60px 0;text-align:center;color:var(--text-muted);}
  </style>
</head>
<body>
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">Virtual<span>Dentist</span>.ai</div>
      <div class="auth-subtitle">Operational metrics</div>
      <label class="field-label" for="auth-email">Email</label>
      <input class="field-input" id="auth-email" type="email" autocomplete="username" />
      <label class="field-label" for="auth-password">Password</label>
      <input class="field-input" id="auth-password" type="password" autocomplete="current-password" />
      <button class="btn-primary" id="auth-btn" type="button">Sign In</button>
      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>
  <div id="app">
    <div class="header">
      <div class="header-logo">Virtual<span>Dentist</span>.ai</div>
      <div class="header-right">
        <a class="back-link" href="ddsdashboard.html">&larr; Dashboard</a>
        <span id="header-user"></span>
        <button class="signout-btn" id="signout-btn" type="button">Sign out</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="period-chips">
        <button class="chip" id="chip-1" type="button">Today</button>
        <button class="chip active" id="chip-7" type="button">7 days</button>
        <button class="chip" id="chip-30" type="button">30 days</button>
        <button class="chip" id="chip-0" type="button">All time</button>
      </div>
      <div class="toolbar-right">
        <span id="last-updated"></span>
        <button class="refresh-btn" id="refresh-btn" type="button" title="Refresh">&#8635;</button>
      </div>
    </div>
    <div class="main" id="main"><div class="loading">Loading metrics…</div></div>
  </div>

  <script>
    var SUPABASE_URL="https://zjwnqryeefegqfmamaqd.supabase.co";
    var SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpqd25xcnllZWZlZ3FmbWFtYXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDkwNzEsImV4cCI6MjA4NzA4NTA3MX0.1y6zegT86moJ-Kl3UNkqimd06qV7Ef5Om3s2NpVCtNI";
    var REVIEWER_NAMES={"4nroots@gmail.com":"Dr. Balaji Swaminath","hamitranu@gmail.com":"Dr. Hamit Ranu"};
    var GENERAL_INBOUND_SOURCES={"vapi_general_sam":1,"general_sam_voice_escalation":1};
    var SRC_LABELS={ag1_emergency:"Emergency LP",ag2_afterhours:"After-hours LP",ag5_infection:"Infection LP",web_form:"Website form",in_office:"In-office QR",widget_contact:"Contact widget",widget_chat:"Chat widget",widget:"Widget"};

    function isTest(s){return typeof s==="string"&&s.toLowerCase().indexOf("test")!==-1;}
    function escHtml(v){if(v==null)return "";return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
    function median(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y;});var m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
    function pct(n,d){return d>0?Math.round((n/d)*100):0;}
    function fmtDur(s){if(s==null)return "—";s=Math.round(s);return Math.floor(s/60)+"m "+(s%60)+"s";}
    function fmtMins(m){if(m==null)return "—";if(m<1)return "<1 min";if(m>=60)return Math.floor(m/60)+"h "+Math.round(m%60)+"m";return Math.round(m)+" min";}
    function getSO(c){var so=c.structured_output;if(!so)return {};if(typeof so==="string"){try{return JSON.parse(so);}catch(e){return {};}}return so;}
    function laneOf(c){if(c.source==="vapi"&&GENERAL_INBOUND_SOURCES[c.intake_source])return "general";if(c.source==="vapi")return "emergency";return "form_only";}
    function isAssistantEnd(r){r=(r||"").toLowerCase();return r.indexOf("assistant")!==-1||r.indexOf("end-call")!==-1;}

    if(!window.supabase||!window.supabase.createClient){document.getElementById("auth-error").style.display="block";document.getElementById("auth-error").textContent="Supabase library failed to load.";throw new Error("supabase missing");}
    var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    var currentPeriod=7;

    document.getElementById("auth-btn").addEventListener("click",handleLogin);
    document.getElementById("signout-btn").addEventListener("click",function(){sb.auth.signOut().finally(function(){location.reload();});});
    document.getElementById("refresh-btn").addEventListener("click",loadMetrics);
    [1,7,30,0].forEach(function(d){document.getElementById("chip-"+d).addEventListener("click",function(){setPeriod(d);});});
    document.getElementById("auth-password").addEventListener("keydown",function(e){if(e.key==="Enter")handleLogin();});

    async function handleLogin(){
      var email=document.getElementById("auth-email").value.trim();var pw=document.getElementById("auth-password").value;
      var btn=document.getElementById("auth-btn");var err=document.getElementById("auth-error");err.style.display="none";
      if(!email||!pw){err.textContent="Enter both email and password.";err.style.display="block";return;}
      btn.disabled=true;btn.textContent="Signing in…";
      try{var r=await sb.auth.signInWithPassword({email:email,password:pw});if(r.error){err.textContent=r.error.message||"Sign-in failed.";err.style.display="block";return;}showApp(r.data.user);}
      catch(e){err.textContent=(e&&e.message)||"Unexpected error.";err.style.display="block";}
      finally{btn.disabled=false;btn.textContent="Sign In";}
    }
    async function init(){try{var r=await sb.auth.getSession();if(r.data&&r.data.session&&r.data.session.user)showApp(r.data.session.user);}catch(e){console.error(e);}}
    function showApp(user){document.getElementById("auth-screen").style.display="none";document.getElementById("app").style.display="flex";document.getElementById("header-user").textContent=REVIEWER_NAMES[user.email]||user.email||"";loadMetrics();}
    function setPeriod(d){currentPeriod=d;[1,7,30,0].forEach(function(x){document.getElementById("chip-"+x).classList.toggle("active",x===d);});loadMetrics();}
    function sinceISO(){if(currentPeriod===0)return null;var s=new Date();if(currentPeriod===1)s.setHours(0,0,0,0);else s.setDate(s.getDate()-currentPeriod);return s.toISOString();}

    function isAuthErr(e){if(!e)return false;var m=((e.message||"")+" "+(e.code||"")).toLowerCase();return m.indexOf("jwt")!==-1||m.indexOf("token")!==-1||m.indexOf("expired")!==-1||m.indexOf("not authenticated")!==-1;}

    async function runQueries(since){
      var ctq=sb.from("call_transcripts").select("id,vapi_call_id,ended_reason,duration_seconds,intake_source,created_at");
      var tcq=sb.from("triage_cases").select("id,created_at,severity,triage_tag,intake_source,source,extraction_source,duration_seconds,ended_reason,structured_output,triage_completed_at,reviewed_at,final_disposition,appointment_booked,subsequent_appointment_booked,revenue_generated,nps_score,nps_submitted_at,patient_language,vapi_call_id");
      var smsq=sb.from("sms_log").select("case_id,direction,sender_email,sent_at").eq("direction","outbound");
      if(since){ctq=ctq.gte("created_at",since);tcq=tcq.gte("created_at",since);smsq=smsq.gte("sent_at",since);}
      return Promise.all([ctq,tcq,smsq]);
    }

    async function loadMetrics(){
      var main=document.getElementById("main");var rb=document.getElementById("refresh-btn");rb.disabled=true;
      var since=sinceISO();
      try{
        var res=await runQueries(since);
        // Auth refresh-retry: if a query failed on an expired token, refresh once and retry.
        if([res[0].error,res[1].error,res[2].error].some(isAuthErr)){
          try{await sb.auth.refreshSession();}catch(e){}
          res=await runQueries(since);
        }
        var errs=[res[0].error,res[1].error,res[2].error].filter(Boolean);
        if(errs.length){main.innerHTML='<div class="panel"><div class="panel-title">Could not load some data</div><div class="empty">'+errs.map(function(e){return escHtml(e.message);}).join("<br>")+'</div><div class="note-line">If this mentions permission/RLS on a table, it needs an authenticated SELECT policy + grant. If it mentions JWT/token, sign out and back in.</div></div>';return;}
        var calls=(res[0].data||[]).filter(function(c){return !isTest(c.intake_source);});
        var cases=(res[1].data||[]).filter(function(c){return !isTest(c.intake_source);});
        var sms=res[2].data||[];
        render(calls,cases,sms);
        document.getElementById("last-updated").textContent="Updated "+new Date().toLocaleTimeString("en-CA",{hour:"2-digit",minute:"2-digit"});
      }catch(e){main.innerHTML='<div class="panel"><div class="empty">Unexpected error: '+escHtml((e&&e.message)||"unknown")+'</div></div>';}
      finally{rb.disabled=false;}
    }

    function card(label,val,note){return '<div class="card"><div class="card-label">'+escHtml(label)+'</div><div class="card-val">'+val+'</div>'+(note?'<div class="card-note">'+escHtml(note)+'</div>':'')+'</div>';}
    function qhead(num,title,sub){return '<div class="qhead"><span class="qhead-num">'+num+'</span><span class="qhead-title">'+escHtml(title)+'</span></div>'+(sub?'<div class="qhead-sub">'+escHtml(sub)+'</div>':'');}
    function laneLabel(text,color){return '<div class="lane-label"><span class="lane-dot" style="background:'+color+'"></span>'+escHtml(text)+'</div>';}
    function bar(name,count,total,color){var p=pct(count,total);return '<div class="bar-row"><span class="bar-name">'+escHtml(name)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+p+'%;background:'+color+'"></span></span><span class="bar-val">'+count+' · '+p+'%</span></div>';}
    function sevBars(arr,color){var sev={critical:0,urgent:0,routine:0};arr.forEach(function(c){var s=(c.severity||"").toLowerCase();if(sev[s]!=null)sev[s]++;});var t=arr.length;return bar("Critical",sev.critical,t,"var(--critical)")+bar("Urgent",sev.urgent,t,"var(--urgent)")+bar("Routine",sev.routine,t,"var(--routine)");}

    function render(calls,cases,sms){
      var general=cases.filter(function(c){return laneOf(c)==="general";});
      var emergency=cases.filter(function(c){return laneOf(c)==="emergency";});
      var formOnly=cases.filter(function(c){return laneOf(c)==="form_only";});
      var html="";

      /* ===== Q1 — WHAT CAME IN ===== */
      html+=qhead("1","What came in","Two lanes: General Sam answers the phone; Emergency Sam calls back after a form");

      // General Sam inbound funnel (from call_transcripts)
      var tot=calls.length,eng=0,xfer=0,hang=0,sysf=0;
      calls.forEach(function(c){var r=(c.ended_reason||"").toLowerCase();var d=Number(c.duration_seconds)||0;
        if(r.indexOf("forward")!==-1)xfer++;
        else if(r.indexOf("silence")!==-1||r.indexOf("not-found")!==-1||r.indexOf("error")!==-1||r.indexOf("pipeline")!==-1)sysf++;
        else if(r.indexOf("customer-ended")!==-1&&d<15)hang++;
        else eng++;});
      var pastGreeting=tot-hang-sysf;
      html+=laneLabel("General Sam — inbound calls","var(--cyan)");
      html+='<div class="cards">'+
        card("Calls in",tot)+
        card("Engaged Sam",eng+' <small>'+pct(eng,tot)+'%</small>')+
        card("Asked for a person",xfer+' <small>'+pct(xfer,tot)+'%</small>',"transferred to office")+
        card("Hung up in greeting",hang+' <small>'+pct(hang,tot)+'%</small>',"customer ended <15s")+
        '</div><div class="cards">'+
        card("System errors / no answer",sysf+' <small>'+pct(sysf,tot)+'%</small>',"availability signal — outage bucket")+
        card("Became a documented case",general.length+' <small>of '+pastGreeting+'</small>',"inbound cases / calls past greeting")+
        '</div>';
      html+='<div class="note-line">Test calls (yours / Ranu\u2019s) are excluded only where tagged; untagged test hangups still sit in this bucket until caller_number lands, so the hangup share reads slightly high.</div>';

      // Emergency Sam post-form lane (from triage_cases)
      var emComplete=emergency.filter(function(c){return isAssistantEnd(c.ended_reason);}).length;
      html+=laneLabel("Emergency Sam — post-form callbacks","var(--urgent)");
      html+='<div class="cards">'+
        card("Callbacks made",emergency.length,"form completed \u2192 Sam called")+
        card("Sam completed the call",emComplete+' <small>'+pct(emComplete,emergency.length)+'%</small>',"assistant ended the call")+
        card("Form intakes, no callback",formOnly.length,"routine, SMS-only, or not yet called")+
        '</div>';
      html+='<div class="panel"><div class="panel-title">Form intakes with no voice callback — severity split (watch for urgent cases that should have been called)</div>'+
        (formOnly.length?sevBars(formOnly):'<div class="empty">None in this window.</div>')+'</div>';

      // Where intakes came from (campaign attribution)
      var srcCounts={};cases.concat([]).forEach(function(c){if(laneOf(c)!=="general"){var s=c.intake_source||"unknown";srcCounts[s]=(srcCounts[s]||0)+1;}});
      var srcEntries=Object.keys(srcCounts).map(function(k){return [k,srcCounts[k]];}).sort(function(a,b){return b[1]-a[1];});
      var srcTotal=srcEntries.reduce(function(s,e){return s+e[1];},0);
      html+='<div class="panel"><div class="panel-title">Where intakes came from ('+srcTotal+' form-origin cases)</div>';
      if(!srcEntries.length)html+='<div class="empty">No form-origin intakes in this window.</div>';
      else srcEntries.forEach(function(e){html+=bar(SRC_LABELS[e[0]]||e[0],e[1],srcTotal,"var(--cyan)");});
      html+='</div>';

      // When calls came in (General inbound, by hour)
      var hours=new Array(24).fill(0),after=0;
      calls.forEach(function(c){var d=new Date(c.created_at);var h=d.getHours();hours[h]++;var dow=d.getDay();if(dow===0||dow===6||h<8||h>=18)after++;});
      var maxH=Math.max.apply(null,hours.concat([1]));
      html+='<div class="panel"><div class="panel-title">When inbound calls came in — '+after+' of '+tot+' ('+pct(after,tot)+'%) after-hours / weekend</div><div class="hours">';
      hours.forEach(function(n){html+='<span class="hour-bar" style="height:'+Math.round((n/maxH)*100)+'%" title="'+n+'"></span>';});
      html+='</div><div class="hours-axis"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>11p</span></div></div>';

      /* ===== Q2 — HOW FAST DID WE RESPOND ===== */
      html+=qhead("2","How fast did we respond","Sam\u2019s capture time per lane, then how quickly a human followed up");
      var genDur=calls.map(function(c){return Number(c.duration_seconds);}).filter(function(n){return Number.isFinite(n)&&n>=15;});
      var emDur=emergency.map(function(c){return Number(c.duration_seconds);}).filter(function(n){return Number.isFinite(n)&&n>0;});
      // Human first response: first dashboard outbound (sender_email present) minus case created_at.
      var firstHuman={};sms.forEach(function(m){if(!m.case_id||!m.sender_email)return;var t=new Date(m.sent_at).getTime();if(!firstHuman[m.case_id]||t<firstHuman[m.case_id])firstHuman[m.case_id]=t;});
      var resp=[];cases.forEach(function(c){var fh=firstHuman[c.id];if(!fh)return;var mins=(fh-new Date(c.created_at).getTime())/60000;if(Number.isFinite(mins)&&mins>=0)resp.push(mins);});
      html+='<div class="cards">'+
        card("Sam capture · General (voice)",fmtDur(median(genDur)),genDur.length?("median, n="+genDur.length):"no engaged calls yet")+
        card("Sam capture · Emergency",fmtDur(median(emDur)),emDur.length?("median, n="+emDur.length):"no callbacks yet")+
        card("Human first response",resp.length?fmtMins(median(resp)):"—",resp.length?("median, n="+resp.length):"no dashboard replies yet")+
        '</div>';
      html+='<div class="note-line">Human response = first text sent from a dashboard vs. when the case landed (dashboard texts only; a phone callback off-system won\u2019t show). Review/closure latency is deliberately left out until reviewed_at is split into "dentist reviewed" vs "patient seen" \u2014 today it fires days later at closure, so it measures throughput, not responsiveness, and doesn\u2019t belong here.</div>';

      /* ===== Q3 — WHAT DID IT PRODUCE ===== */
      html+=qhead("3","What did it produce","Bookings, retention, satisfaction, cost \u2014 the diligence view");
      var clinical=general.concat(emergency); // documented clinical cases that involved Sam
      var allCases=cases;
      var booked=allCases.filter(function(c){return c.final_disposition==="booked"||(typeof c.revenue_generated==="number"&&c.revenue_generated>0);}).length;
      var followUp=allCases.filter(function(c){return c.subsequent_appointment_booked===true;}).length;
      var npsRows=allCases.filter(function(c){return Number.isInteger(c.nps_score);});
      var prom=npsRows.filter(function(c){return c.nps_score>=9;}).length,det=npsRows.filter(function(c){return c.nps_score<=6;}).length;
      var nps=npsRows.length?Math.round(prom/npsRows.length*100-det/npsRows.length*100):null;
      var revRows=allCases.filter(function(c){return typeof c.revenue_generated==="number"&&c.revenue_generated>0;});
      var revTotal=revRows.reduce(function(s,c){return s+c.revenue_generated;},0);
      html+='<div class="cards">'+
        card("Booked",booked+' <small>of '+allCases.length+'</small>',allCases.length?(pct(booked,allCases.length)+"% \u2014 from disposition / revenue"):"")+
        card("Further treatment booked",followUp,"retention signal")+
        card("NPS",nps!=null?(nps>0?"+"+nps:String(nps)):"—",npsRows.length?("n="+npsRows.length):"no survey responses yet")+
        card("Revenue recorded",revTotal>0?("$"+revTotal.toLocaleString()):"—",revRows.length?("n="+revRows.length+" cases"):"none entered yet")+
        '</div>';
      html+='<div class="note-line">"Booked" infers from disposition or recorded revenue, since the front desk has no booking control yet \u2014 the office-dashboard toggle (booked + new vs. returning) is the fix that makes this a clean, front-desk-owned number.</div>';

      // Disposition breakdown
      var dispo={};allCases.forEach(function(c){if(c.final_disposition){dispo[c.final_disposition]=(dispo[c.final_disposition]||0)+1;}});
      var dispoEntries=Object.keys(dispo).map(function(k){return [k,dispo[k]];}).sort(function(a,b){return b[1]-a[1];});
      var dispoTotal=dispoEntries.reduce(function(s,e){return s+e[1];},0);
      html+='<div class="panel"><div class="panel-title">Final disposition ('+dispoTotal+' recorded)</div>';
      if(!dispoTotal)html+='<div class="empty">No dispositions recorded yet.</div>';
      else dispoEntries.forEach(function(e){html+=bar(e[0].replace(/_/g," "),e[1],dispoTotal,"var(--cyan)");});
      html+='</div>';

      // Red-flag frequency across clinical cases (from structured_output)
      var f={Fever:0,Swelling:0,Trauma:0,"Airway concern":0,Bleeding:0,"Nocturnal pain":0,"Cold lingers":0,Immunocompromised:0};
      clinical.forEach(function(c){var so=getSO(c);if(so.fever)f.Fever++;if(so.swelling||so.swelling_present)f.Swelling++;if(so.trauma)f.Trauma++;if(so.difficulty_breathing_or_swallowing)f["Airway concern"]++;if(so.uncontrolled_bleeding)f.Bleeding++;if(so.nocturnal_pain)f["Nocturnal pain"]++;if(so.cold_pain_lingers_over_10_seconds)f["Cold lingers"]++;if(so.immunocompromised)f.Immunocompromised++;});
      html+='<div class="panel"><div class="panel-title">Clinical red flags ('+clinical.length+' cases with Sam involvement)</div><div class="flag-grid">';
      Object.keys(f).forEach(function(k){html+='<div class="flag">'+escHtml(k)+'<b>'+f[k]+'</b></div>';});
      html+='</div></div>';

      html+='<div class="panel"><div class="panel-title">Unit economics — cost to run vs. value created</div><div class="empty">Pending real vendor rates. Cost-per-call and cost-per-case compute here from call duration and message counts once actual Vapi / OpenAI / ElevenLabs / Azure / Twilio usage is read for the window, calibrated monthly against invoices. No placeholder figures until the rates are real.</div></div>';

      document.getElementById("main").innerHTML=html;
    }
    init();
  </script>
</body>
</html>
