<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VirtualDentist.ai — Operational Metrics</title>
  <!-- REFACTOR_MARKER_2026_05_28_METRICS_V3_THREE_QUESTION -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy-0:#071323; --navy-1:#0a1628; --navy-2:#0f2044;
      --cyan:#00c8e8; --cyan-dim:#0097b2;
      --text-primary:#e8f0fe; --text-secondary:#b4c7e2; --text-muted:#7f96b8; --text-faint:#5f7597;
      --border:rgba(255,255,255,0.08); --surface:rgba(255,255,255,0.035); --surface-2:rgba(255,255,255,0.02);
      --critical:#e84545; --urgent:#f0a500; --routine:#00c87a; --ok:#00c87a; --warn:#f0a500; --danger:#e84545;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{background:var(--navy-0);min-height:100%;}
    body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at top center,rgba(51,108,190,0.16),transparent 28%),linear-gradient(180deg,var(--navy-0),var(--navy-1));
      color:var(--text-primary);font-size:14px;line-height:1.5;min-height:100vh;}
    button,input,a{font:inherit;}

    #auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .auth-card{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(18,39,81,0.95),rgba(11,27,58,0.95));border:1px solid var(--border);border-radius:18px;padding:36px 30px;}
    .auth-logo{font-size:18px;font-weight:700;margin-bottom:6px;}
    .auth-logo span{color:var(--cyan);}
    .auth-subtitle{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:26px;}
    .field-label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
    .field-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:14px;padding:12px 14px;outline:none;margin-bottom:16px;}
    .field-input:focus{border-color:rgba(0,200,232,0.3);}
    .btn-primary{width:100%;background:linear-gradient(135deg,#4c8fd2,#69cbe7);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;padding:14px;cursor:pointer;}
    .btn-primary:disabled{opacity:.55;}
    .auth-error{background:rgba(232,69,69,0.12);border:1px solid rgba(232,69,69,0.3);border-radius:8px;color:#ff9b9b;font-size:13px;padding:10px 12px;margin-top:12px;display:none;white-space:pre-wrap;}

    #app{display:none;flex-direction:column;min-height:100vh;}
    .header{background:rgba(15,32,68,0.94);border-bottom:1px solid var(--border);padding:0 18px;min-height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
    .header-logo{font-size:15px;font-weight:700;}
    .header-logo span{color:var(--cyan);}
    .header-right{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-muted);}
    .signout-btn{background:none;border:1px solid var(--border);color:var(--text-secondary);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:12px;}

    .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:16px 20px 0;}
    .period-chips{display:flex;gap:6px;}
    .chip{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);cursor:pointer;}
    .chip.active{background:rgba(0,200,232,0.16);border-color:rgba(0,200,232,0.4);color:var(--cyan);}
    .toolbar-right{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-muted);}
    .refresh-btn{background:none;border:1px solid var(--border);color:var(--text-secondary);border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:15px;}

    .main{padding:8px 20px 60px;max-width:1100px;margin:0 auto;width:100%;}
    .qhead{display:flex;align-items:baseline;gap:10px;margin:30px 0 4px;}
    .qhead-num{font-size:13px;font-weight:700;color:var(--cyan);}
    .qhead-title{font-size:17px;font-weight:600;color:var(--text-primary);}
    .qhead-sub{font-size:12px;color:var(--text-faint);margin:0 0 14px 24px;}

    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 16px;}
    .card-label{font-size:12px;color:var(--text-secondary);margin-bottom:7px;}
    .card-val{font-size:25px;font-weight:600;line-height:1.1;}
    .card-val small{font-size:14px;color:var(--text-faint);font-weight:400;}
    .card-note{font-size:11px;color:var(--text-faint);margin-top:5px;}

    .panel{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
    .panel-title{font-size:13px;color:var(--text-secondary);margin-bottom:12px;}
    .bar-row{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:9px;}
    .bar-name{width:150px;color:var(--text-secondary);flex-shrink:0;}
    .bar-track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden;}
    .bar-fill{display:block;height:100%;border-radius:4px;}
    .bar-val{width:64px;text-align:right;flex-shrink:0;}
    .empty{font-size:13px;color:var(--text-faint);font-style:italic;padding:6px 0;}
    .note-line{font-size:11px;color:var(--text-faint);margin:-4px 0 18px;}
    .loading{padding:60px 0;text-align:center;color:var(--text-muted);}
  </style>
</head>
<body>
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">Virtual<span>Dentist</span>.ai</div>
      <div class="auth-subtitle">Operational metrics</div>
      <label class="field-label" for="auth-email">Email</label>
      <input class="field-input" id="auth-email" type="email" autocomplete="username" />
      <label class="field-label" for="auth-password">Password</label>
      <input class="field-input" id="auth-password" type="password" autocomplete="current-password" />
      <button class="btn-primary" id="auth-btn" type="button">Sign In</button>
      <div class="auth-error" id="auth-error"></div>
    </div>
  </div>

  <div id="app">
    <div class="header">
      <div class="header-logo">Virtual<span>Dentist</span>.ai</div>
      <div class="header-right">
        <span id="header-user"></span>
        <button class="signout-btn" id="signout-btn" type="button">Sign out</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="period-chips">
        <button class="chip" id="chip-1" type="button">Today</button>
        <button class="chip active" id="chip-7" type="button">7 days</button>
        <button class="chip" id="chip-30" type="button">30 days</button>
        <button class="chip" id="chip-0" type="button">All time</button>
      </div>
      <div class="toolbar-right">
        <span id="last-updated"></span>
        <button class="refresh-btn" id="refresh-btn" type="button" title="Refresh">&#8635;</button>
      </div>
    </div>
    <div class="main" id="main"><div class="loading">Loading metrics…</div></div>
  </div>

  <script>
    var SUPABASE_URL = "https://zjwnqryeefegqfmamaqd.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpqd25xcnllZWZlZ3FmbWFtYXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDkwNzEsImV4cCI6MjA4NzA4NTA3MX0.1y6zegT86moJ-Kl3UNkqimd06qV7Ef5Om3s2NpVCtNI";
    var REVIEWER_NAMES = { "4nroots@gmail.com":"Dr. Balaji Swaminath", "hamitranu@gmail.com":"Dr. Hamit Ranu" };

    // Calls/cases whose intake_source contains "test" are excluded everywhere.
    // NOTE: this only catches TAGGED test cases. Bare "is Sam up?" hangup test
    // calls from you/Ranu hit the production assistant and are NOT distinguishable
    // in call_transcripts yet — that needs a caller_number column + a known-number
    // allowlist (next small step). Until then, the hangup rate may slightly
    // over-count by your own test hangups.
    function isTest(src){ return typeof src === "string" && src.toLowerCase().indexOf("test") !== -1; }

    function escHtml(v){ if(v==null) return ""; return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function median(arr){ if(!arr.length) return null; var s=arr.slice().sort(function(a,b){return a-b;}); var m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
    function pct(n,d){ return d>0?Math.round((n/d)*100):0; }
    function fmtDur(s){ if(s==null) return "—"; s=Math.round(s); var m=Math.floor(s/60); return m+"m "+(s%60)+"s"; }
    function fmtMins(mins){ if(mins==null) return "—"; if(mins<1) return "<1 min"; if(mins>=60){ var h=Math.floor(mins/60); return h+"h "+Math.round(mins%60)+"m"; } return Math.round(mins)+" min"; }

    if(!window.supabase||!window.supabase.createClient){ document.getElementById("auth-error").style.display="block"; document.getElementById("auth-error").textContent="Supabase library failed to load."; throw new Error("supabase missing"); }
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var currentPeriod = 7;

    document.getElementById("auth-btn").addEventListener("click", handleLogin);
    document.getElementById("signout-btn").addEventListener("click", function(){ sb.auth.signOut().finally(function(){ location.reload(); }); });
    document.getElementById("refresh-btn").addEventListener("click", loadMetrics);
    [1,7,30,0].forEach(function(d){ document.getElementById("chip-"+d).addEventListener("click", function(){ setPeriod(d); }); });
    document.getElementById("auth-password").addEventListener("keydown", function(e){ if(e.key==="Enter") handleLogin(); });

    async function handleLogin(){
      var email=document.getElementById("auth-email").value.trim();
      var pw=document.getElementById("auth-password").value;
      var btn=document.getElementById("auth-btn"); var err=document.getElementById("auth-error");
      err.style.display="none";
      if(!email||!pw){ err.textContent="Enter both email and password."; err.style.display="block"; return; }
      btn.disabled=true; btn.textContent="Signing in…";
      try{
        var r=await sb.auth.signInWithPassword({ email:email, password:pw });
        if(r.error){ err.textContent=r.error.message||"Sign-in failed."; err.style.display="block"; return; }
        showApp(r.data.user);
      }catch(e){ err.textContent=(e&&e.message)||"Unexpected error."; err.style.display="block"; }
      finally{ btn.disabled=false; btn.textContent="Sign In"; }
    }
    async function init(){ try{ var r=await sb.auth.getSession(); if(r.data&&r.data.session&&r.data.session.user) showApp(r.data.session.user); }catch(e){ console.error(e); } }
    function showApp(user){ document.getElementById("auth-screen").style.display="none"; document.getElementById("app").style.display="flex"; document.getElementById("header-user").textContent=REVIEWER_NAMES[user.email]||user.email||""; loadMetrics(); }
    function setPeriod(d){ currentPeriod=d; [1,7,30,0].forEach(function(x){ document.getElementById("chip-"+x).classList.toggle("active", x===d); }); loadMetrics(); }

    function sinceISO(){ if(currentPeriod===0) return null; var s=new Date(); if(currentPeriod===1){ s.setHours(0,0,0,0); } else { s.setDate(s.getDate()-currentPeriod); } return s.toISOString(); }

    async function loadMetrics(){
      var main=document.getElementById("main");
      var rb=document.getElementById("refresh-btn");
      rb.disabled=true;
      var since=sinceISO();
      try{
        // SECTION 1 source: every call that reached Vapi (incl. hangups/transfers
        // that never became a case). This is the only table that sees them.
        var ctq=sb.from("call_transcripts").select("id,vapi_call_id,ended_reason,duration_seconds,intake_source,created_at");
        if(since) ctq=ctq.gte("created_at",since);
        // SECTION 2 + 3 source: documented cases.
        var tcq=sb.from("triage_cases").select("id,created_at,severity,triage_tag,intake_source,source,extraction_source,duration_seconds,triage_completed_at,contacted_patient_at,appointment_booked,subsequent_appointment_booked,revenue_generated,nps_score,nps_submitted_at,patient_language,vapi_call_id");
        if(since) tcq=tcq.gte("created_at",since);
        // Human first-response source: outbound texts sent from a dashboard
        // (send-sms.ts stamps sender_email; system/cron sends do not).
        var smsq=sb.from("sms_log").select("case_id,direction,sender_email,sent_at").eq("direction","outbound");
        if(since) smsq=smsq.gte("sent_at",since);

        var res=await Promise.all([ctq,tcq,smsq]);
        var calls=(res[0].data||[]).filter(function(c){ return !isTest(c.intake_source); });
        var cases=(res[1].data||[]).filter(function(c){ return !isTest(c.intake_source); });
        var sms=res[2].data||[];

        var errs=[res[0].error,res[1].error,res[2].error].filter(Boolean);
        if(errs.length){ main.innerHTML='<div class="panel"><div class="panel-title">Could not load some data</div><div class="empty">'+errs.map(function(e){return escHtml(e.message);}).join("<br>")+'</div><div class="note-line">If this mentions permission / RLS on call_transcripts or sms_log, those tables need an authenticated SELECT policy — see the SQL in the deploy notes.</div></div>'; return; }

        render(calls, cases, sms);
        document.getElementById("last-updated").textContent="Updated "+new Date().toLocaleTimeString("en-CA",{hour:"2-digit",minute:"2-digit"});
      }catch(e){ main.innerHTML='<div class="panel"><div class="empty">Unexpected error: '+escHtml((e&&e.message)||"unknown")+'</div></div>'; }
      finally{ rb.disabled=false; }
    }

    function card(label,val,note){ return '<div class="card"><div class="card-label">'+escHtml(label)+'</div><div class="card-val">'+val+'</div>'+(note?'<div class="card-note">'+escHtml(note)+'</div>':'')+'</div>'; }
    function qhead(num,title,sub){ return '<div class="qhead"><span class="qhead-num">'+num+'</span><span class="qhead-title">'+escHtml(title)+'</span></div>'+(sub?'<div class="qhead-sub">'+escHtml(sub)+'</div>':''); }
    function bar(name,count,total,color){ var p=pct(count,total); return '<div class="bar-row"><span class="bar-name">'+escHtml(name)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+p+'%;background:'+color+'"></span></span><span class="bar-val">'+count+' · '+p+'%</span></div>'; }

    function render(calls, cases, sms){
      var html="";

      /* ============ SECTION 1 — WHAT CAME IN ============ */
      var totalCalls=calls.length;
      // Classify each call by ended_reason + duration.
      var engaged=0, transferred=0, greetingHangup=0, systemFail=0, other=0;
      calls.forEach(function(c){
        var r=(c.ended_reason||"").toLowerCase();
        var d=Number(c.duration_seconds)||0;
        if(r.indexOf("forward")!==-1){ transferred++; }
        else if(r.indexOf("silence")!==-1 || r.indexOf("not-found")!==-1 || r.indexOf("error")!==-1 || r.indexOf("pipeline")!==-1){ systemFail++; }
        else if(r.indexOf("customer-ended")!==-1 && d<15){ greetingHangup++; }
        else if(r.indexOf("assistant")!==-1 || d>=15){ engaged++; }
        else { other++; }
      });
      var pastGreeting=totalCalls-greetingHangup-systemFail;
      var voiceCases=cases.filter(function(c){ return c.source==="vapi"; }).length;

      html+=qhead("1","What came in", currentPeriod===0?"All calls and texts that reached the system":"Calls and texts in the selected window");
      html+='<div class="cards">';
      html+=card("Calls in", totalCalls);
      html+=card("Engaged Sam", engaged+' <small>'+pct(engaged,totalCalls)+'%</small>');
      html+=card("Asked for a person", transferred+' <small>'+pct(transferred,totalCalls)+'%</small>',"transferred to office");
      html+=card("Hung up in greeting", greetingHangup+' <small>'+pct(greetingHangup,totalCalls)+'%</small>',"customer ended <15s");
      html+='</div>';
      html+='<div class="cards">';
      html+=card("System errors / no answer", systemFail+' <small>'+pct(systemFail,totalCalls)+'%</small>',"silence-timeout / routing error");
      html+=card("Became a documented case", voiceCases+' <small>of '+pastGreeting+'</small>',"of calls past the greeting");
      html+='</div>';
      html+='<div class="note-line">"System errors / no answer" is the availability signal — this is the bucket that catches a Vapi outage. Distinguishing a true dead-air failure from a fast patient hangup precisely needs a per-call assistant-turn check (next iteration); for now silence-timeouts and routing errors land here.</div>';

      // What they wanted (from cases)
      var clinical=cases.filter(function(c){ return c.triage_tag!=="non_emergent_inquiry"; }).length;
      var admin=cases.filter(function(c){ return c.triage_tag==="non_emergent_inquiry"; }).length;
      var sev={critical:0,urgent:0,routine:0};
      cases.forEach(function(c){ var s=(c.severity||"").toLowerCase(); if(sev[s]!=null) sev[s]++; });
      html+='<div class="panel"><div class="panel-title">What they wanted ('+cases.length+' documented cases)</div>';
      if(cases.length===0){ html+='<div class="empty">No documented cases in this window yet.</div>'; }
      else{
        html+=bar("Clinical concern", clinical, cases.length, "var(--urgent)");
        html+=bar("Booking / admin", admin, cases.length, "var(--cyan)");
        html+='<div style="height:8px"></div>';
        html+=bar("— Critical", sev.critical, cases.length, "var(--critical)");
        html+=bar("— Urgent", sev.urgent, cases.length, "var(--urgent)");
        html+=bar("— Routine", sev.routine, cases.length, "var(--routine)");
      }
      html+='</div>';

      /* ============ SECTION 2 — HOW FAST DID WE RESPOND ============ */
      html+=qhead("2","How fast did we respond","Sam's capture time, then how quickly a human followed up");

      // Voice capture = call duration (engaged calls).
      var voiceDur=calls.map(function(c){ return Number(c.duration_seconds); }).filter(function(n){ return Number.isFinite(n)&&n>=15; });
      var voiceCapture=median(voiceDur);
      // SMS capture = created_at -> triage_completed_at, for SMS-extracted cases.
      var smsCapMins=cases.filter(function(c){ return /sms/.test(c.extraction_source||"")&&c.created_at&&c.triage_completed_at; })
        .map(function(c){ return (new Date(c.triage_completed_at)-new Date(c.created_at))/60000; }).filter(function(n){ return Number.isFinite(n)&&n>=0; });
      var smsCapture=median(smsCapMins);

      // Human first response = first dashboard outbound (sender_email present) minus case anchor.
      var firstHuman={};
      sms.forEach(function(m){ if(!m.case_id||!m.sender_email) return; var t=new Date(m.sent_at).getTime(); if(!firstHuman[m.case_id]||t<firstHuman[m.case_id]) firstHuman[m.case_id]=t; });
      var respMins=[];
      cases.forEach(function(c){
        var fh=firstHuman[c.id]; if(!fh) return;
        var anchor=(c.source==="vapi")?new Date(c.created_at).getTime():(c.triage_completed_at?new Date(c.triage_completed_at).getTime():new Date(c.created_at).getTime());
        var mins=(fh-anchor)/60000; if(Number.isFinite(mins)&&mins>=0) respMins.push(mins);
      });
      var humanResp=median(respMins);

      html+='<div class="cards">';
      html+=card("Sam capture · voice", fmtDur(voiceCapture), voiceDur.length?("median, n="+voiceDur.length):"no engaged calls yet");
      html+=card("Sam capture · text", smsCapture!=null?fmtMins(smsCapture):"—", smsCapMins.length?("median, n="+smsCapMins.length):"no SMS cases yet");
      html+=card("Human first response", humanResp!=null?fmtMins(humanResp):"—", respMins.length?("median, n="+respMins.length):"no dashboard replies yet");
      html+='</div>';
      html+='<div class="note-line">Human response = first text sent from a dashboard, vs. when the case landed. It captures dashboard texts only; a staff phone callback outside the dashboard won\'t show. Closure (patient seen) is tracked in section 3 as an outcome, not a response time.</div>';

      /* ============ SECTION 3 — WHAT DID IT PRODUCE ============ */
      html+=qhead("3","What did it produce","Bookings, retention, satisfaction, and cost — the diligence view");

      var booked=cases.filter(function(c){ return c.appointment_booked===true; }).length;
      var followUp=cases.filter(function(c){ return c.subsequent_appointment_booked===true; }).length;
      // NPS
      var npsRows=cases.filter(function(c){ return Number.isInteger(c.nps_score); });
      var prom=npsRows.filter(function(c){ return c.nps_score>=9; }).length;
      var det=npsRows.filter(function(c){ return c.nps_score<=6; }).length;
      var nps=npsRows.length?Math.round((prom/npsRows.length)*100 - (det/npsRows.length)*100):null;
      var revRows=cases.filter(function(c){ return typeof c.revenue_generated==="number"&&c.revenue_generated>0; });
      var revTotal=revRows.reduce(function(s,c){ return s+c.revenue_generated; },0);

      html+='<div class="cards">';
      html+=card("Visits booked", booked+' <small>of '+cases.length+'</small>', cases.length?(pct(booked,cases.length)+"% of cases"):"");
      html+=card("Further treatment booked", followUp, "retention signal");
      html+=card("NPS", nps!=null?(nps>0?"+"+nps:String(nps)):"—", npsRows.length?("n="+npsRows.length):"no survey responses yet");
      html+=card("Revenue recorded", revTotal>0?("$"+revTotal.toLocaleString()):"—", revRows.length?("n="+revRows.length+" cases"):"none entered yet");
      html+='</div>';
      html+='<div class="panel"><div class="panel-title">Unit economics — cost to run vs. value created</div>'
        +'<div class="empty">Pending real vendor rates. Once we read actual Vapi / OpenAI / ElevenLabs / Azure / Twilio usage for the live window, cost-per-call and cost-per-case compute here from call duration and message counts, calibrated monthly against invoices. No placeholder figures until the rates are real.</div></div>';

      document.getElementById("main").innerHTML=html;
    }

    init();
  </script>
</body>
</html>
