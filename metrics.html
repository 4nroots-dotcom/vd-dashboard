<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VirtualDentist.ai — Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0a1628;
    --navy-mid: #0f2044;
    --navy-light: #1a3260;
    --cyan: #00c8e8;
    --cyan-dim: #0097b2;
    --cyan-faint: rgba(0,200,232,0.08);
    --urgent: #e84545;
    --urgent-bg: rgba(232,69,69,0.12);
    --emergency: #f0a500;
    --emergency-bg: rgba(240,165,0,0.12);
    --routine: #00c87a;
    --routine-bg: rgba(0,200,122,0.10);
    --text-primary: #e8f0fe;
    --text-secondary: #7b93bc;
    --text-muted: #4a6080;
    --border: rgba(255,255,255,0.07);
    --border-active: rgba(0,200,232,0.3);
    --surface: rgba(255,255,255,0.03);
    --surface-hover: rgba(255,255,255,0.06);
    --radius: 10px;
    --radius-sm: 6px;
  }

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
font-family: ‘Sora’, sans-serif;
background: var(–navy);
color: var(–text-primary);
min-height: 100vh;
font-size: 14px;
line-height: 1.5;
}

/* ── AUTH ── */
#auth-screen {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
background: radial-gradient(ellipse at 50% 0%, #0f2a50 0%, var(–navy) 70%);
}

.auth-card {
width: 100%;
max-width: 380px;
background: var(–navy-mid);
border: 1px solid var(–border);
border-radius: 16px;
padding: 40px 32px;
box-shadow: 0 32px 80px rgba(0,0,0,0.5);
}

.auth-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
.auth-logo-text {
font-size: 18px; font-weight: 600;
background: linear-gradient(135deg, #1a7fc4, var(–cyan));
-webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.auth-title { font-size: 13px; color: var(–text-secondary); margin-bottom: 24px; }

.field-label { display: block; font-size: 11px; font-weight: 500; color: var(–text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }

.field-input {
width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(–border);
border-radius: var(–radius-sm); color: var(–text-primary);
font-family: ‘Sora’, sans-serif; font-size: 14px; padding: 12px 14px;
outline: none; transition: border-color 0.2s; margin-bottom: 16px;
}
.field-input:focus { border-color: var(–border-active); }
.field-input::placeholder { color: var(–text-muted); }

.btn-primary {
width: 100%; background: linear-gradient(135deg, #1a7fc4, var(–cyan-dim));
color: white; border: none; border-radius: var(–radius-sm);
font-family: ‘Sora’, sans-serif; font-size: 14px; font-weight: 600;
padding: 14px; cursor: pointer; transition: opacity 0.2s; margin-top: 4px;
}
.btn-primary:disabled { opacity: 0.5; }

.auth-error {
background: var(–urgent-bg); border: 1px solid rgba(232,69,69,0.3);
border-radius: var(–radius-sm); color: #ff8080; font-size: 13px;
padding: 10px 12px; margin-top: 12px; display: none;
}

/* ── APP ── */
#app { display: none; flex-direction: column; min-height: 100vh; }

/* ── HEADER ── */
.header {
background: var(–navy-mid); border-bottom: 1px solid var(–border);
padding: 0 16px; height: 56px; display: flex; align-items: center;
justify-content: space-between; position: sticky; top: 0; z-index: 100;
}

.header-logo {
display: flex; align-items: center; gap: 10px;
font-size: 15px; font-weight: 600;
background: linear-gradient(135deg, #1a7fc4, var(–cyan));
-webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.header-right { display: flex; align-items: center; gap: 12px; }

.btn-signout {
background: transparent; border: 1px solid var(–border); border-radius: var(–radius-sm);
color: var(–text-secondary); font-family: ‘Sora’, sans-serif; font-size: 12px;
padding: 6px 12px; cursor: pointer; transition: border-color 0.2s, color 0.2s;
}
.btn-signout:hover { border-color: var(–border-active); color: var(–cyan); }

/* ── PAGE ── */
.page { padding: 20px 16px; max-width: 900px; margin: 0 auto; }

.page-title {
font-size: 20px; font-weight: 600; margin-bottom: 4px;
background: linear-gradient(135deg, var(–text-primary), var(–cyan));
-webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.page-sub { font-size: 13px; color: var(–text-muted); margin-bottom: 20px; }

/* ── PERIOD FILTER ── */
.period-row {
display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap;
}

.period-chip {
background: var(–surface); border: 1px solid var(–border);
border-radius: 20px; color: var(–text-secondary);
font-family: ‘Sora’, sans-serif; font-size: 12px; font-weight: 500;
padding: 6px 14px; cursor: pointer; transition: all 0.2s;
}
.period-chip.active { background: var(–cyan-faint); border-color: var(–border-active); color: var(–cyan); }

/* ── KPI GRID ── */
.kpi-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 10px;
margin-bottom: 20px;
}

@media (min-width: 500px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 700px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }

.kpi-card {
background: var(–surface); border: 1px solid var(–border);
border-radius: var(–radius); padding: 14px 16px;
position: relative; overflow: hidden;
}

.kpi-card::after {
content: ‘’; position: absolute;
bottom: 0; left: 0; right: 0; height: 2px;
}

.kpi-card.cyan::after { background: linear-gradient(90deg, var(–cyan-dim), var(–cyan)); }
.kpi-card.urgent::after { background: var(–urgent); }
.kpi-card.emergency::after { background: var(–emergency); }
.kpi-card.routine::after { background: var(–routine); }

.kpi-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(–text-muted); margin-bottom: 6px; }
.kpi-value { font-family: ‘DM Mono’, monospace; font-size: 26px; font-weight: 500; color: var(–text-primary); line-height: 1; margin-bottom: 4px; }
.kpi-sub { font-size: 11px; color: var(–text-muted); }

/* ── SECTION ── */
.metrics-section { margin-bottom: 20px; }

.section-title {
font-size: 11px; font-weight: 600; text-transform: uppercase;
letter-spacing: 0.08em; color: var(–text-secondary); margin-bottom: 10px;
}

/* ── BAR CHART ── */
.bar-card {
background: var(–surface); border: 1px solid var(–border);
border-radius: var(–radius); padding: 16px;
}

.bar-row {
display: flex; align-items: center; gap: 10px;
margin-bottom: 10px;
}
.bar-row:last-child { margin-bottom: 0; }

.bar-label { font-size: 12px; color: var(–text-secondary); min-width: 120px; flex-shrink: 0; }
.bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
.bar-val { font-family: ‘DM Mono’, monospace; font-size: 12px; color: var(–text-secondary); min-width: 50px; text-align: right; flex-shrink: 0; }

/* ── TWO COL ── */
.two-col { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 600px) { .two-col { grid-template-columns: 1fr 1fr; } }

/* ── DISTRIBUTION PIE (CSS only) ── */
.donut-card {
background: var(–surface); border: 1px solid var(–border);
border-radius: var(–radius); padding: 16px;
display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
}

.donut-wrap { position: relative; width: 90px; height: 90px; flex-shrink: 0; }

.donut-svg { width: 90px; height: 90px; transform: rotate(-90deg); }
.donut-center {
position: absolute; inset: 0; display: flex; align-items: center;
justify-content: center; flex-direction: column;
}
.donut-total { font-family: ‘DM Mono’, monospace; font-size: 20px; font-weight: 500; }
.donut-total-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(–text-muted); }

.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.legend-row { display: flex; align-items: center; gap: 8px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend-label { font-size: 12px; color: var(–text-secondary); flex: 1; }
.legend-val { font-family: ‘DM Mono’, monospace; font-size: 12px; color: var(–text-primary); }

/* ── TIME METRICS ── */
.time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(–border); border-radius: var(–radius); overflow: hidden; }
.time-cell { background: var(–navy); padding: 14px 16px; }
.time-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; color: var(–text-muted); margin-bottom: 6px; }
.time-value { font-family: ‘DM Mono’, monospace; font-size: 22px; font-weight: 500; color: var(–text-primary); }
.time-sub { font-size: 11px; color: var(–text-muted); margin-top: 2px; }

/* ── NULL FIELD RATES ── */
.null-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.null-row { display: flex; align-items: center; gap: 10px; }
.null-label { font-size: 12px; color: var(–text-secondary); min-width: 140px; flex-shrink: 0; }
.null-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.null-fill { height: 100%; border-radius: 3px; background: var(–text-muted); transition: width 0.6s ease; }
.null-fill.high { background: var(–urgent); }
.null-fill.med { background: var(–emergency); }
.null-fill.low { background: var(–routine); }
.null-pct { font-family: ‘DM Mono’, monospace; font-size: 11px; color: var(–text-muted); min-width: 36px; text-align: right; }

/* ── LOADING ── */
.loading { padding: 60px; text-align: center; color: var(–text-muted); font-size: 13px; }
.loading-dots::after { content: ‘…’; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { 0%,100% { content: ‘.’; } 33% { content: ‘..’; } 66% { content: ‘…’; } }

/* ── BACK LINK ── */
.back-link {
display: inline-flex; align-items: center; gap: 6px;
color: var(–text-muted); font-size: 12px; text-decoration: none;
margin-bottom: 16px; transition: color 0.2s;
}
.back-link:hover { color: var(–cyan); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(–navy-light); border-radius: 2px; }
</style>

</head>

<script>
const SUPABASE_URL = 'https://zjwnqryeefegqfmamaqd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpqd25xcnllZWZlZ3FmbWFtYXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MDkwNzEsImV4cCI6MjA4NzA4NTA3MX0.1y6zegT86moJ-Kl3UNkqimd06qV7Ef5Om3s2NpVCtNI';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentPeriod = 30;

// ── AUTH ──
async function handleLogin() {
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-password').value;
  const btn = document.getElementById('auth-btn');
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) {
    errEl.textContent = error.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign In'; return;
  }
  showApp();
}

document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

async function handleSignOut() { await sb.auth.signOut(); location.reload(); }

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) showApp();
})();

function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadMetrics();
}

// ── PERIOD ──
function setPeriod(days) {
  currentPeriod = days;
  document.querySelectorAll('.period-chip').forEach((c, i) => {
    c.classList.toggle('active', [7, 30, 90, 365][i] === days);
  });
  loadMetrics();
}

// ── LOAD ──
async function loadMetrics() {
  const since = currentPeriod === 365
    ? new Date(0).toISOString()
    : new Date(Date.now() - currentPeriod * 86400000).toISOString();

  const { data, error } = await sb
    .from('triage_cases')
    .select('id, created_at, severity, extraction_source, duration_seconds, reviewed_at, contacted_patient_at, er_referral, prescription_issued, final_disposition, structured_output, review_status, patient_name')
    .gte('created_at', since)
    .order('created_at', { ascending: true });

  if (error) {
    document.getElementById('metrics-body').innerHTML = `<div class="loading" style="color:var(--urgent)">Error loading metrics</div>`;
    return;
  }

  const cases = data || [];
  const label = currentPeriod === 365
    ? `All time · ${cases.length} calls`
    : `Last ${currentPeriod} days · ${cases.length} calls`;
  document.getElementById('period-label').textContent = label;

  renderMetrics(cases);
}

function renderMetrics(cases) {
  if (!cases.length) {
    document.getElementById('metrics-body').innerHTML = `<div class="loading">No data for this period</div>`;
    return;
  }

  const total = cases.length;

  // Severity distribution
  const bySev = { urgent: 0, emergency: 0, routine: 0 };
  cases.forEach(c => { if (bySev[c.severity] !== undefined) bySev[c.severity]++; });
  const urgentPct = pct(bySev.urgent, total);
  const emergPct = pct(bySev.emergency, total);
  const routinePct = pct(bySev.routine, total);

  // Extraction source
  const bySource = { vapi: 0, openai: 0, none: 0 };
  cases.forEach(c => { const s = c.extraction_source || 'none'; if (bySource[s] !== undefined) bySource[s]++; });

  // Time metrics (minutes)
  const reviewTimes = cases
    .filter(c => c.reviewed_at && c.created_at)
    .map(c => (new Date(c.reviewed_at) - new Date(c.created_at)) / 60000);
  const contactTimes = cases
    .filter(c => c.contacted_patient_at && c.created_at)
    .map(c => (new Date(c.contacted_patient_at) - new Date(c.created_at)) / 60000);
  const avgReview = reviewTimes.length ? Math.round(avg(reviewTimes)) : null;
  const avgContact = contactTimes.length ? Math.round(avg(contactTimes)) : null;

  // Duration
  const durations = cases.filter(c => c.duration_seconds).map(c => c.duration_seconds / 60);
  const avgDur = durations.length ? avg(durations).toFixed(1) : null;

  // Reviewed
  const reviewed = cases.filter(c => c.review_status === 'reviewed').length;
  const reviewedPct = pct(reviewed, total);

  // ER referral & prescriptions
  const erCount = cases.filter(c => c.er_referral === true).length;
  const rxCount = cases.filter(c => c.prescription_issued === true).length;

  // After-hours (before 8am or after 6pm)
  const afterHours = cases.filter(c => {
    const h = new Date(c.created_at).getHours();
    return h < 8 || h >= 18;
  }).length;
  const afterHoursPct = pct(afterHours, total);

  // Final disposition breakdown
  const dispositions = {};
  cases.forEach(c => {
    const d = c.final_disposition || 'pending';
    dispositions[d] = (dispositions[d] || 0) + 1;
  });

  // Red flag frequency
  const redFlags = {
    'Airway / Swallowing': cases.filter(c => c.structured_output?.difficulty_breathing_or_swallowing).length,
    'Fever + Swelling': cases.filter(c => c.structured_output?.fever && (c.structured_output?.swelling || c.structured_output?.swelling_present)).length,
    'Uncontrolled Bleeding': cases.filter(c => c.structured_output?.uncontrolled_bleeding).length,
    'Avulsed Tooth': cases.filter(c => c.structured_output?.avulsed_tooth).length,
    'Immunocompromised': cases.filter(c => c.structured_output?.immunocompromised).length,
  };

  // Null field rates
  const nullFields = [
    { label: 'Chief complaint', nullCount: cases.filter(c => !c.structured_output?.chief_complaint).length },
    { label: 'Pain score', nullCount: cases.filter(c => c.structured_output?.pain_score == null).length },
    { label: 'Location (jaw)', nullCount: cases.filter(c => !c.structured_output?.jaw).length },
    { label: 'Location (side)', nullCount: cases.filter(c => !c.structured_output?.side).length },
    { label: 'Onset', nullCount: cases.filter(c => !c.structured_output?.onset).length },
    { label: 'Patient name', nullCount: cases.filter(c => !c.patient_name).length },
  ];

  // Donut segments
  const donutSegs = buildDonut([
    { val: bySev.urgent, color: 'var(--urgent)' },
    { val: bySev.emergency, color: 'var(--emergency)' },
    { val: bySev.routine, color: 'var(--routine)' },
  ], total);

  document.getElementById('metrics-body').innerHTML = `

    <!-- KPI ROW -->
    <div class="kpi-grid">
      <div class="kpi-card cyan">
        <div class="kpi-label">Total Calls</div>
        <div class="kpi-value">${total}</div>
        <div class="kpi-sub">triage sessions</div>
      </div>
      <div class="kpi-card urgent">
        <div class="kpi-label">Urgent</div>
        <div class="kpi-value">${bySev.urgent}</div>
        <div class="kpi-sub">${urgentPct}% of calls</div>
      </div>
      <div class="kpi-card emergency">
        <div class="kpi-label">Emergency</div>
        <div class="kpi-value">${bySev.emergency}</div>
        <div class="kpi-sub">${emergPct}% of calls</div>
      </div>
      <div class="kpi-card routine">
        <div class="kpi-label">Routine</div>
        <div class="kpi-value">${bySev.routine}</div>
        <div class="kpi-sub">${routinePct}% of calls</div>
      </div>
      <div class="kpi-card cyan">
        <div class="kpi-label">Reviewed</div>
        <div class="kpi-value">${reviewedPct}%</div>
        <div class="kpi-sub">${reviewed} of ${total}</div>
      </div>
      <div class="kpi-card cyan">
        <div class="kpi-label">After Hours</div>
        <div class="kpi-value">${afterHoursPct}%</div>
        <div class="kpi-sub">${afterHours} calls</div>
      </div>
      <div class="kpi-card urgent">
        <div class="kpi-label">ER Referrals</div>
        <div class="kpi-value">${erCount}</div>
        <div class="kpi-sub">${pct(erCount, total)}% of calls</div>
      </div>
      <div class="kpi-card emergency">
        <div class="kpi-label">Prescriptions</div>
        <div class="kpi-value">${rxCount}</div>
        <div class="kpi-sub">${pct(rxCount, total)}% of calls</div>
      </div>
    </div>

    <!-- SEVERITY + EXTRACTION -->
    <div class="two-col metrics-section">
      <div>
        <div class="section-title">Severity Distribution</div>
        <div class="donut-card">
          <div class="donut-wrap">
            <svg class="donut-svg" viewBox="0 0 36 36">
              ${donutSegs}
            </svg>
            <div class="donut-center">
              <div class="donut-total">${total}</div>
              <div class="donut-total-label">calls</div>
            </div>
          </div>
          <div class="donut-legend">
            <div class="legend-row">
              <div class="legend-dot" style="background:var(--urgent)"></div>
              <span class="legend-label">Urgent</span>
              <span class="legend-val">${bySev.urgent} (${urgentPct}%)</span>
            </div>
            <div class="legend-row">
              <div class="legend-dot" style="background:var(--emergency)"></div>
              <span class="legend-label">Emergency</span>
              <span class="legend-val">${bySev.emergency} (${emergPct}%)</span>
            </div>
            <div class="legend-row">
              <div class="legend-dot" style="background:var(--routine)"></div>
              <span class="legend-label">Routine</span>
              <span class="legend-val">${bySev.routine} (${routinePct}%)</span>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="section-title">Extraction Source</div>
        <div class="bar-card">
          ${barRow('Vapi (primary)', bySource.vapi, total, 'var(--cyan)')}
          ${barRow('OpenAI (fallback)', bySource.openai, total, 'var(--emergency)')}
          ${barRow('None', bySource.none, total, 'var(--text-muted)')}
        </div>
      </div>
    </div>

    <!-- TIME METRICS -->
    <div class="metrics-section">
      <div class="section-title">Time Metrics</div>
      <div class="time-grid">
        <div class="time-cell">
          <div class="time-label">Avg Time to Review</div>
          <div class="time-value">${avgReview != null ? fmtMinutes(avgReview) : '—'}</div>
          <div class="time-sub">${reviewTimes.length} reviewed cases</div>
        </div>
        <div class="time-cell">
          <div class="time-label">Avg Time to Contact</div>
          <div class="time-value">${avgContact != null ? fmtMinutes(avgContact) : '—'}</div>
          <div class="time-sub">${contactTimes.length} contacted cases</div>
        </div>
        <div class="time-cell">
          <div class="time-label">Avg Call Duration</div>
          <div class="time-value">${avgDur != null ? avgDur + 'm' : '—'}</div>
          <div class="time-sub">${durations.length} calls with duration</div>
        </div>
        <div class="time-cell">
          <div class="time-label">After Hours %</div>
          <div class="time-value">${afterHoursPct}%</div>
          <div class="time-sub">before 8am or after 6pm</div>
        </div>
      </div>
    </div>

    <!-- RED FLAGS -->
    <div class="metrics-section">
      <div class="section-title">Red Flag Frequency</div>
      <div class="bar-card">
        ${Object.entries(redFlags).map(([label, count]) => barRow(label, count, total, 'var(--urgent)')).join('')}
      </div>
    </div>

    <!-- FINAL DISPOSITION -->
    <div class="metrics-section">
      <div class="section-title">Final Disposition</div>
      <div class="bar-card">
        ${Object.entries(dispositions).sort((a,b) => b[1]-a[1]).map(([label, count]) =>
          barRow(fmtDisposition(label), count, total, 'var(--cyan-dim)')
        ).join('')}
      </div>
    </div>

    <!-- NULL FIELD RATES -->
    <div class="metrics-section">
      <div class="section-title">Null Field Rates — Data Completeness</div>
      <div class="bar-card">
        <div class="null-grid">
          ${nullFields.map(f => {
            const p = pct(f.nullCount, total);
            const cls = p > 40 ? 'high' : p > 20 ? 'med' : 'low';
            return `<div class="null-row">
              <span class="null-label">${f.label}</span>
              <div class="null-track"><div class="null-fill ${cls}" style="width:${p}%"></div></div>
              <span class="null-pct">${p}%</span>
            </div>`;
          }).join('')}
        </div>
        <div style="margin-top:12px;font-size:11px;color:var(--text-muted)">% of calls where field was not captured. Lower is better.</div>
      </div>
    </div>

  `;
}

// ── HELPERS ──
function pct(n, total) { return total ? Math.round(n / total * 100) : 0; }
function avg(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }

function fmtMinutes(m) {
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}

function fmtDisposition(d) {
  const map = { booked: 'Booked appointment', referred_er: 'Referred to ER', rx_only: 'Prescription only', declined: 'Patient declined', no_response: 'No response', pending: 'Pending / not set' };
  return map[d] || d;
}

function barRow(label, count, total, color) {
  const p = pct(count, total);
  return `<div class="bar-row">
    <span class="bar-label">${label}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${color}"></div></div>
    <span class="bar-val">${count} (${p}%)</span>
  </div>`;
}

function buildDonut(segs, total) {
  if (!total) return '';
  const r = 15.9155;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  let svgParts = '';
  segs.forEach(seg => {
    const frac = seg.val / total;
    const dash = frac * circ;
    const gap = circ - dash;
    svgParts += `<circle cx="18" cy="18" r="${r}" fill="none" stroke="${seg.color}" stroke-width="3.5" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-offset * circ / 360).toFixed(2)}"/>`;
    offset += frac * 360;
  });
  return svgParts;
}
</script>

</body>
</html>
