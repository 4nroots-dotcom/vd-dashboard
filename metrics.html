<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>VirtualDentist.ai - Operational Metrics</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body {
      background: #071323;
      min-height: 100%;
    }

    :root {
      --navy-0: #071323;
      --navy-1: #0a1628;
      --navy-2: #0f2044;
      --navy-3: #17305e;
      --cyan: #00c8e8;
      --cyan-soft: #73d7f3;
      --cyan-dim: #0097b2;
      --white: #f5f9ff;
      --text-primary: #e8f0fe;
      --text-secondary: #b4c7e2;
      --text-muted: #7f96b8;
      --text-faint: #5f7597;
      --border: rgba(255,255,255,0.08);
      --border-soft: rgba(255,255,255,0.05);
      --surface: rgba(255,255,255,0.035);
      --surface-2: rgba(255,255,255,0.02);
      --surface-3: rgba(255,255,255,0.05);
      --shadow-lg: 0 26px 70px rgba(0,0,0,0.34);
      --shadow-md: 0 14px 32px rgba(0,0,0,0.18);
      --urgent: #e84545;
      --emergency: #f0a500;
      --routine: #00c87a;
      --warning: #f0a500;
      --danger: #e84545;
      --success: #00c87a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top center, rgba(51, 108, 190, 0.16), transparent 28%), radial-gradient(circle at bottom left, rgba(0, 200, 232, 0.06), transparent 24%), linear-gradient(180deg, var(--navy-0) 0%, var(--navy-1) 100%);
      color: var(--text-primary); font-size: 14px; line-height: 1.5; min-height: 100vh; overscroll-behavior: none;
    }

    button, input, a { font: inherit; }

    #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #0f2a50 0%, #071323 72%); }
    .auth-card { width: 100%; max-width: 390px; background: linear-gradient(180deg, rgba(18, 39, 81, 0.95) 0%, rgba(11, 27, 58, 0.95) 100%); border: 1px solid var(--border); border-radius: 18px; padding: 38px 30px; box-shadow: 0 32px 80px rgba(0,0,0,0.52); backdrop-filter: blur(10px); }
    .auth-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .auth-logo-text { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #1a7fc4, #00c8e8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .auth-subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 28px; letter-spacing: 0.1em; text-transform: uppercase; }
    .field-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .field-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; padding: 12px 14px; outline: none; transition: border-color 0.2s, background 0.2s; margin-bottom: 16px; }
    .field-input:focus { border-color: rgba(0,200,232,0.3); background: rgba(255,255,255,0.08); }
    .field-input::placeholder { color: var(--text-faint); }
    .btn-primary { width: 100%; background: linear-gradient(135deg, #4c8fd2 0%, #69cbe7 100%); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; padding: 14px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 4px; box-shadow: 0 14px 30px rgba(49,128,212,0.24); }
    .btn-primary:active { transform: scale(0.985); opacity: 0.92; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .auth-error { background: rgba(232,69,69,0.12); border: 1px solid rgba(232,69,69,0.3); border-radius: 8px; color: #ff9b9b; font-size: 13px; padding: 10px 12px; margin-top: 12px; display: none; white-space: pre-wrap; }

    #app { display: none; flex-direction: column; min-height: 100vh; }
    .header { background: rgba(15, 32, 68, 0.94); border-bottom: 1px solid var(--border); padding: 0 18px; min-height: 58px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 120; backdrop-filter: blur(10px); }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .header-logo { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 650; background: linear-gradient(135deg, #1a7fc4, #00c8e8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; white-space: nowrap; }
    .page-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #08111e; background: linear-gradient(135deg, #4c8fd2, #69cbe7); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-user { font-size: 12px; color: var(--text-secondary); display: none; }
    @media (min-width: 520px) { .header-user { display: block; } }
    .btn-signout { background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); font-size: 12px; padding: 6px 12px; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
    .btn-signout:hover { border-color: rgba(0,200,232,0.3); color: var(--cyan); }

    .toolbar { background: rgba(15, 32, 68, 0.9); border-bottom: 1px solid var(--border); padding: 10px 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; backdrop-filter: blur(10px); }
    @media (min-width: 768px) { .toolbar { position: sticky; top: 58px; z-index: 110; } }
    .toolbar-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-right: 2px; }
    .period-chip { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 20px; color: var(--text-secondary); font-size: 12px; font-weight: 600; padding: 6px 14px; cursor: pointer; transition: all 0.2s; }
    .period-chip.active { background: rgba(0,200,232,0.08); border-color: rgba(0,200,232,0.3); color: var(--cyan); }
    .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .refresh-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); padding: 6px 10px; cursor: pointer; font-size: 16px; transition: color 0.2s, border-color 0.2s; line-height: 1; }
    .refresh-btn:hover { color: var(--cyan); border-color: rgba(0,200,232,0.3); }
    .refresh-btn.spinning { animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .last-updated { font-size: 11px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .back-link { font-size: 12px; color: var(--text-secondary); text-decoration: none; transition: color 0.2s; font-weight: 600; white-space: nowrap; }
    .back-link:hover { color: var(--cyan); }

    .main { flex: 1; padding: 18px; max-width: 1160px; margin: 0 auto; width: 100%; }
    .loading-overlay { padding: 72px 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
    .loading-dots::after { content: "..."; animation: dots 1.2s steps(4,end) infinite; }
    @keyframes dots { 0%,100% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } }

    .section-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 12px; }
    .section-head:first-child { margin-top: 0; }
    .section-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); white-space: nowrap; }
    .section-line { flex: 1; height: 1px; background: rgba(255,255,255,0.06); }

    .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    @media (min-width: 760px) { .hero-grid { grid-template-columns: repeat(4, 1fr); } }
    .hero-card { background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.025)); border: 1px solid var(--border); border-radius: 14px; padding: 16px; position: relative; overflow: hidden; min-height: 116px; box-shadow: var(--shadow-md); }
    .hero-card::after { content: ""; position: absolute; inset: 0 auto auto 0; width: 100%; height: 3px; background: var(--accent, rgba(0,200,232,0.3)); }
    .hc-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 10px; }
    .hc-value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 28px; font-weight: 700; color: var(--accent-color, var(--text-primary)); line-height: 1.02; margin-bottom: 8px; word-break: break-word; }
    .hc-sub { font-size: 12px; color: var(--text-secondary); line-height: 1.45; }

    .panel { background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.02)); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-md); }
    .panel-head { padding: 13px 18px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.02); }
    .panel-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }
    .panel-subtle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; color: var(--text-secondary); }
    .panel-body { padding: 16px; }
    .panel-divider { height: 1px; background: rgba(255,255,255,0.05); margin: 14px 0; }
    .panel-sub-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-muted); margin-bottom: 10px; }

    .two-col { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px; }
    @media (min-width: 860px) { .two-col { grid-template-columns: 1fr 1fr; } }

    .mini-list { display: flex; flex-direction: column; }
    .mini-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .mini-row:last-child { border-bottom: none; }
    .mini-row-label { font-size: 13px; color: var(--text-secondary); }
    .mini-row-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; color: var(--text-primary); text-align: right; }
    .mini-row-val.ok { color: var(--success); }
    .mini-row-val.warn { color: var(--warning); }
    .mini-row-val.danger { color: var(--danger); }
    .mini-row-val.cyan { color: var(--cyan); }

    .stack-list { display: flex; flex-direction: column; gap: 14px; }
    .stack-row-label { display: flex; justify-content: space-between; margin-bottom: 6px; gap: 10px; }
    .stack-name { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
    .stack-name.urgent { color: var(--urgent); }
    .stack-name.emergency { color: var(--emergency); }
    .stack-name.routine { color: var(--routine); }
    .stack-name.cyan { color: var(--cyan); }
    .stack-stats { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; color: var(--text-secondary); }
    .stack-track { height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
    .stack-fill { height: 100%; border-radius: 4px; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
    .stack-fill.urgent { background: linear-gradient(90deg, #8b2020, #e84545); }
    .stack-fill.emergency { background: linear-gradient(90deg, #8b6000, #f0a500); }
    .stack-fill.routine { background: linear-gradient(90deg, #007040, #00c87a); }
    .stack-fill.cyan { background: linear-gradient(90deg, #1a7fc4, #00c8e8); }

    .histogram { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; height: 160px; margin-top: 8px; }
    .hist-col { display: flex; flex-direction: column; align-items: center; justify-content: end; gap: 8px; height: 100%; }
    .hist-bar-wrap { flex: 1; width: 100%; display: flex; align-items: end; }
    .hist-bar { width: 100%; min-height: 8px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, rgba(0,200,232,0.95), rgba(0,151,178,0.55)); transition: height 0.7s cubic-bezier(0.4,0,0.2,1); }
    .hist-label { font-size: 10px; color: var(--text-secondary); text-align: center; line-height: 1.2; }
    .hist-count { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; color: var(--text-primary); font-weight: 700; }

    .tod-chart { display: flex; align-items: flex-end; gap: 2px; height: 74px; }
    .tod-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
    .tod-bar { width: 100%; border-radius: 2px 2px 0 0; min-height: 2px; transition: height 0.6s cubic-bezier(0.4,0,0.2,1); }
    .tod-bar.biz { background: rgba(0,200,232,0.2); border: 1px solid rgba(0,200,232,0.15); border-bottom: none; }
    .tod-bar.after { background: rgba(240,165,0,0.22); border: 1px solid rgba(240,165,0,0.18); border-bottom: none; }
    .tod-tick { font-size: 8px; color: var(--text-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .tod-legend { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
    .tod-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
    .tod-legend-dot { width: 8px; height: 8px; border-radius: 2px; }

    .flag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 520px) { .flag-grid { grid-template-columns: 1fr; } }
    .flag-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; display: flex; align-items: center; gap: 10px; }
    .flag-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .flag-label { font-size: 12px; color: var(--text-secondary); flex: 1; }
    .flag-count { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 16px; font-weight: 700; }

    .ext-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .ext-row:last-child { border-bottom: none; }
    .ext-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .ext-label { font-size: 13px; color: var(--text-secondary); flex: 1; }
    .ext-bar-wrap { width: 72px; }
    .ext-bar-track { height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; }
    .ext-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s; }
    .ext-count { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; color: var(--text-primary); width: 28px; text-align: right; font-weight: 700; }
    .ext-pct { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; color: var(--text-muted); width: 36px; text-align: right; }

    .no-data { color: var(--text-muted); font-size: 13px; text-align: center; padding: 22px; }

    /* ---- SATISFACTION ---- */
    .sat-score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .sat-score-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
    .sat-score-value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 32px; font-weight: 800; color: var(--cyan); line-height: 1; }
    .sat-score-denom { font-size: 14px; color: var(--text-muted); }
    .sat-score-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.10em; color: var(--text-muted); margin-top: 6px; }
    .sat-feedback-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .sat-feedback-item:last-child { border-bottom: none; }
    .sat-feedback-quote { font-size: 13px; color: var(--text-secondary); line-height: 1.6; font-style: italic; }
    .sat-feedback-date { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #0f2044; border: 1px solid rgba(0,200,232,0.3); border-radius: 10px; padding: 12px 20px; font-size: 13px; color: var(--cyan); z-index: 1000; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    #toast.show { transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a3260; border-radius: 2px; }
  </style>
</head>

      html += '<div class="panel"><div class="panel-head"><div class="panel-title">Survey Responses</div><div class="panel-subtle">' + satN + ' response' + (satN !== 1 ? 's' : '') + '</div></div><div class="panel-body">';

      if (satN === 0) {
        html += '<div class="no-data">No survey responses yet. Surveys are sent when a visit is marked complete in the office dashboard.</div>';
      } else {
        html += '<div class="sat-score-grid">' +
          '<div class="sat-score-card"><div class="sat-score-value">' + avgSat + '<span class="sat-score-denom">/5</span></div><div class="sat-score-label">Avg Satisfaction</div></div>' +
          '<div class="sat-score-card"><div class="sat-score-value">' + avgReturn + '<span class="sat-score-denom">/5</span></div><div class="sat-score-label">Avg Return Likelihood</div></div>' +
          '</div>';

        if (recentFeedback.length > 0) {
          html += '<div class="panel-divider"></div><div class="panel-sub-label">Recent Feedback</div>';
          recentFeedback.forEach(function(r) {
            html += '<div class="sat-feedback-item">' +
              '<div class="sat-feedback-quote">&ldquo;' + escHtml(r.survey_feedback) + '&rdquo;</div>' +
              '<div class="sat-feedback-date">' + new Date(r.created_at).toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" }) + '</div>' +
              '</div>';
          });
        }
      }

      html += '</div></div>';
      html += '<div style="height:40px"></div>';

      document.getElementById("main-content").innerHTML = html;
    }

    function isUsableCall(c) { var so = getSO(c); var hasComplaint = !!so.chief_complaint; var hasPain = so.pain_score != null; var hasOnset = !!so.onset; var hasLocation = !!so.jaw || !!so.side; var hasFlags = !!so.swelling || !!so.swelling_present || !!so.trauma || !!so.fever || !!so.uncontrolled_bleeding || !!so.difficulty_breathing_or_swallowing || !!so.nocturnal_pain || !!so.cold_pain_lingers_over_10_seconds; return hasComplaint || hasPain || hasOnset || hasLocation || hasFlags; }
    function secHead(label) { return '<div class="section-head"><span class="section-label">' + escHtml(label) + '</span><div class="section-line"></div></div>'; }
    function hc(label, value, sub, accent, accentColor) { return '<div class="hero-card" style="--accent:' + accent + ';--accent-color:' + accentColor + '"><div class="hc-label">' + escHtml(label) + '</div><div class="hc-value">' + escHtml(String(value)) + '</div>' + (sub ? '<div class="hc-sub">' + escHtml(sub) + '</div>' : '') + '</div>'; }
    function stackBar(cls, label, count, total) { var pp = total > 0 ? Math.round((count / total) * 100) : 0; return '<div><div class="stack-row-label"><span class="stack-name ' + cls + '">' + escHtml(label) + '</span><span class="stack-stats">' + count + ' \u00B7 ' + pp + '%</span></div><div class="stack-track"><div class="stack-fill ' + cls + '" style="width:' + pp + '%"></div></div></div>'; }
    function flagCard(label, count, color) { var active = count > 0; return '<div class="flag-card"><div class="flag-dot" style="background:' + color + ';' + (active ? 'box-shadow:0 0 5px ' + color + '80' : 'opacity:0.25') + '"></div><div class="flag-label">' + escHtml(label) + '</div><div class="flag-count" style="color:' + (active ? color : '#5f7597') + '">' + count + '</div></div>'; }
    function nullRow(label, count, total) { var pp = total > 0 ? Math.round((count / total) * 100) : 0; var cls = pp > 20 ? "danger" : pp > 10 ? "warn" : "ok"; return '<div class="mini-row"><span class="mini-row-label">' + escHtml(label) + '</span><span class="mini-row-val ' + cls + '">' + count + ' (' + pp + '%)</span></div>'; }
    function extractionRow(label, count, total, color) { var pp = total > 0 ? Math.round((count / total) * 100) : 0; return '<div class="ext-row"><div class="ext-dot" style="background:' + color + '"></div><div class="ext-label">' + escHtml(label) + '</div><div class="ext-bar-wrap"><div class="ext-bar-track"><div class="ext-bar-fill" style="width:' + pp + '%;background:' + color + '"></div></div></div><div class="ext-count">' + count + '</div><div class="ext-pct">' + pp + '%</div></div>'; }
    function formatTag(tag) { if (!tag || tag === "-") return "-"; return String(tag).replace(/_/g, " ").replace(/\b\w/g, function(l) { return l.toUpperCase(); }).replace(/ And /g, " & "); }
    function p(n, d) { return d > 0 ? Math.round((n / d) * 100) : 0; }
    function fmtDur(s) { if (s == null) return "\u2014"; return Math.floor(s / 60) + "m " + (s % 60) + "s"; }
    function fmtMin(m) { if (m == null) return "\u2014"; if (m >= 60) return Math.floor(m / 60) + "h " + Math.round(m % 60) + "m"; return Math.round(m) + " min"; }
    function showToast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function() { t.classList.remove("show"); }, 2800); }
    function escHtml(value) { if (value === null || value === undefined) return ""; return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

    init();
  </script>
</body>
</html>
