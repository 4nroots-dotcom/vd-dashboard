.filter-chip {

/* – QUEUE PANEL – */
#queue-panel { display: flex; flex-direction: column; flex: 1; }

/* – CASE CARD – */
.case-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

.case-card {

border: 1px solid rgba(255,255,255,0.07);

.case-row1 {

align-items: center;
gap: 8px;
margin-bottom: 6px;
}

.severity-badge {
font-family: ‘SF Mono’, ‘Monaco’, ‘Menlo’, monospace;
font-size: 10px;
font-weight: 500;
padding: 2px 8px;
border-radius: 4px;
text-transform: uppercase;
letter-spacing: 0.06em;

.badge-urgent { background: rgba(232,69,69,0.12); color: #e84545; border: 1px solid rgba(232,69,69,0.25); }
.badge-emergency { background: rgba(240,165,0,0.12); color: #f0a500; border: 1px solid rgba(240,165,0,0.25); }

.case-name {

font-weight: 500;
color: #e8f0fe;
flex: 1;
min-width: 0;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.case-time {
font-family: ‘SF Mono’, ‘Monaco’, ‘Menlo’, monospace;
font-size: 11px;
color: #6a80a0;
flex-shrink: 0;
}

.case-row2 {
font-size: 13px;
color: #c0d4f0;
margin-bottom: 4px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.case-row3 {
display: flex;
align-items: center;
gap: 12px;
font-family: ‘SF Mono’, ‘Monaco’, ‘Menlo’, monospace;
font-size: 11px;
color: #6a80a0;

.case-meta-item { display: flex; align-items: center; gap: 4px; }

}

.loading-state { padding: 40px; text-align: center; color: #6a80a0; font-size: 13px; }
.loading-dots::after { content: ‘…’; animation: dots 1.2s steps(4, end) infinite; }

/* – CASE DETAIL PANEL – */
#detail-panel {
display: none;
flex-direction: column;
flex: 1;
overflow-y: auto;
}

.detail-header {
position: sticky;

background: #0f2044;

.detail-section {

border-radius: 10px;
overflow: hidden;
}

.section-header {
padding: 12px 16px;
border-bottom: 1px solid rgba(255,255,255,0.07);

.section-title {

font-weight: 600;

.severity-row {
display: flex;
align-items: flex-start;
gap: 12px;
padding: 16px;
}

.severity-icon {
width: 40px;
height: 40px;

align-items: center;

font-size: 20px;

.severity-icon.urgent { background: rgba(232,69,69,0.12); }

.severity-detail-label {
font-family: ‘SF Mono’, ‘Monaco’, ‘Menlo’, monospace;
font-size: 10px;

letter-spacing: 0.1em;

}

.stat-label {
font-size: 10px;

text-transform: uppercase;
letter-spacing: 0.08em;

margin-bottom: 4px;

.stat-value {

font-size: 15px;
font-weight: 500;
color: #e8f0fe;

.flags-grid {
display: grid;

gap: 8px;
padding: 16px;

.flag-item {

font-size: 12px;
color: #b0c8e8;
}

.flag-dot {

}

.flag-dot.present { background: #e84545; box-shadow: 0 0 6px rgba(232,69,69,0.5); }

.clinical-note-text {
font-family: ‘SF Mono’, ‘Monaco’, ‘Menlo’, monospace;

color: #c8daf0;
line-height: 1.7;
white-space: pre-wrap;
word-break: break-word;
}

.note-lock-badge {
font-size: 10px;

border: 1px solid rgba(255,255,255,0.07);

.review-form { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.form-label {

background-repeat: no-repeat;
background-position: right 12px center;

.form-select option { background: #0f2044; }

/* – TOGGLE ROW – */
.toggle-row {
display: flex;
align-items: center;
justify-content: space-between;
padding: 10px 0;
border-bottom: 1px solid rgba(255,255,255,0.07);
}

.toggle-row:last-child { border-bottom: none; }

.toggle-label {
font-size: 13px;
color: #a8bdd8;
}

.toggle {
position: relative;
width: 44px;
height: 24px;
flex-shrink: 0;
}

.toggle input { opacity: 0; width: 0; height: 0; }

.toggle-track {
position: absolute;
inset: 0;
background: #1a3260;
border-radius: 12px;
cursor: pointer;
transition: background 0.2s;
border: 1px solid rgba(255,255,255,0.07);
}

.toggle input:checked + .toggle-track { background: #0097b2; border-color: #0097b2; }

.toggle-track::after {
content: ‘’;
position: absolute;
left: 3px;
top: 50%;
transform: translateY(-50%);
width: 16px;
height: 16px;
background: white;
border-radius: 50%;
transition: transform 0.2s;
}

.toggle input:checked + .toggle-track::after { transform: translateY(-50%) translateX(20px); }

.metrics-link {

// ── SAVE REVIEW ──
async function saveReview(id, markReviewed) {
  const notes = document.getElementById('field-notes').value;
  const disposition = document.getElementById('field-disposition').value;
  const rxIssued = document.getElementById('field-rx').checked;
  const contacted = document.getElementById('field-contacted').checked;
  const statusEl = document.getElementById('save-status');

  statusEl.textContent = 'Saving…';
  statusEl.className = 'save-status';

  const update = {
    review_notes: notes || null,
    final_disposition: disposition || null,
    prescription_issued: rxIssued,
    action_taken: disposition || null,
  };

  if (contacted) {
    update.contacted_patient_at = currentCase?.contacted_patient_at || new Date().toISOString();
  } else {
    update.contacted_patient_at = null;
  }

  if (markReviewed) {
    update.review_status = 'reviewed';
    update.reviewed_at = new Date().toISOString();
    update.reviewed_by = currentUser?.email || null;
  }

  const { error } = await sb.from('triage_cases').update(update).eq('id', id);

  if (error) {
    statusEl.textContent = 'Error saving - ' + error.message;
    statusEl.className = 'save-status error';
    return;
  }

  // Update local cache
  const idx = allCases.findIndex(c => c.id === id);
  if (idx >= 0) { allCases[idx] = { ...allCases[idx], ...update }; }

  statusEl.textContent = markReviewed ? '✓ Marked as reviewed' : '✓ Draft saved';
  statusEl.className = 'save-status success';
  showToast(markReviewed ? 'Case marked reviewed' : 'Draft saved');

  if (markReviewed) {
    renderQueue();
    updateUrgentBadge();
  }

  setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'save-status'; }, 3000);
}

// ── COLLAPSIBLE ──
function toggleCollapsible(id) {
  const body = document.getElementById(id);
  if (!body) return;
  body.classList.toggle('open');
}

// ── UTILS ──
function escHtml(s) {
  if (!s) return '';
  var t=String(s);t=t.split('&').join('&amp;');t=t.split('<').join('&lt;');t=t.split('>').join('&gt;');t=t.split('"').join('&quot;');return t;
}

function formatPhone(p) {
  if (!p) return '-';
  const d = String(p).split('').filter(function(c){return c>='0'&&c<='9';}).join('');
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return p;
}

function formatTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const now = new Date();
  const diffMs = now - d;
  const diffH = diffMs / 3600000;
  if (diffH < 1) return Math.round(diffMs / 60000) + 'm ago';
  if (diffH < 24) return Math.round(diffH) + 'h ago';
  return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
}

function formatDatetime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }) + ' ' +
    d.toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit', hour12: true });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Mobile: on load hide detail column
if (isMobile) {
  document.getElementById('detail-column').style.display = 'none';
}
</script>
