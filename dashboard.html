  html { background: #0a1628 !important; }
  :root {
    --navy: #0a1628;
    --navy-mid: #0f2044;
    --navy-light: #1a3260;
    --cyan: #00c8e8;
    --cyan-dim: #0097b2;
    --cyan-faint: rgba(0,200,232,0.08);
    --urgent: #e84545;
    --urgent-bg: rgba(232,69,69,0.12);
    --emergency: #f0a500;
    --emergency-bg: rgba(240,165,0,0.12);
    --routine: #00c87a;
    --routine-bg: rgba(0,200,122,0.10);
    --text-primary: #e8f0fe;
    --text-secondary: #7b93bc;
    --text-muted: #4a6080;
    --border: rgba(255,255,255,0.07);
    --border-active: rgba(0,200,232,0.3);
    --surface: rgba(255,255,255,0.03);
    --surface-hover: rgba(255,255,255,0.06);
    --radius: 10px;
    --radius-sm: 6px;
  }	∙	{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
font-family: -apple-system, BlinkMacSystemFont, ‘Segoe UI’, sans-serif;
background: #0a1628;
color: #e8f0fe;
min-height: 100vh;
font-size: 14px;
line-height: 1.5;
overscroll-behavior: none;
}
/* – AUTH SCREEN – */
#auth-screen {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
background: radial-gradient(ellipse at 50% 0%, #0f2a50 0%, #0a1628 70%);
}
.auth-card {
width: 100%;
max-width: 380px;
background: #0f2044 !important;
border: 1px solid rgba(255,255,255,0.07);
border-radius: 16px;
padding: 40px 32px;
box-shadow: 0 32px 80px rgba(0,0,0,0.5);
}
.auth-logo {
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 32px;
}
.auth-logo svg { flex-shrink: 0; }
